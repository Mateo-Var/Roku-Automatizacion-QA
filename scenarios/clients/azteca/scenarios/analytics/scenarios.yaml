- id: AN-DISCREPANCIA-PLATAFORMA-01
  status: >
    RESUELTO A FAVOR DEL PR -- en todos los eventos capturados (login,
    screen_view, player_ready, video_views), `plataforma` fue SIEMPRE el
    string fijo idéntico "TV Azteca En Vivo Roku", nunca varió según
    pantalla. Coincide con la redacción del PR-173. No hace falta
    escalar esto como ambigüedad real -- el comportamiento es consistente.
  title: "Meta-check: ¿'plataforma' es un string FIJO o refleja el dispositivo real? (las 2 tablas del ticket dicen cosas distintas)"
  area: [core-network]
  severity: minor
  screen: N/A (análisis transversal de todos los eventos capturados en esta corrida)
  steps:
    - Con todos los eventos ya capturados en AN-01 a AN-08, revisar si el valor de `plataforma` es SIEMPRE idéntico (string fijo "TV Azteca En Vivo Roku", como dice el PR) o si varía/podría variar según el dispositivo (como sugiere la redacción de la tabla de Next Bot, "refleja el dispositivo real")
  expected:
    - Documentar cuál de las 2 interpretaciones coincide con el comportamiento real -- esto no es un bug a resolver por el agente, es una ambigüedad del ticket que hay que reportar de vuelta para que el equipo lo aclare con Analytics (ya el propio ticket dice "Pendiente de confirmar con Analytics" sobre category singular/plural -- esta es una ambigüedad hermana, sobre plataforma)
  logs_watch: []
  visual_check: null
