    los 2 el evento GA4 real reflejó esos géneros múltiples -- ambos
    dieron `category:"not-set"` en player_ready/video_views (ver AN-02).
    Es decir: **no se puede confirmar ni refutar el formato "coma-
    separado en un campo" que pide este caso, porque el valor de category
    no está llegando con NINGÚN género real todavía** -- el bug de AN-02
    bloquea por completo la validación de este caso. Sigue pendiente
    hasta que category traiga el/los género(s) real(es) de al menos un
    show (con 1 o más géneros) para recién ahí poder juzgar el formato.
  title: "Contenido con MÚLTIPLES categorías: se reportan todas separadas por coma en un solo campo (Next Bot QA-09)"
  area: [core-network]
  severity: minor
  screen: Player o ShowPage (contenido multi-categoría)
