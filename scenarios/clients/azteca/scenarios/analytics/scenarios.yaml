- id: AN-09
  status: >
    NO CORRIDO en esta sesión -- se cortó antes de buscar un contenido
    multi-categoría. Pendiente. NOTA CRUZADA: el valor "CMS, Lotería del
    Crimen" visto en AN-02 SÍ tiene el formato "algo, algo" separado por
    coma dentro de un solo campo `category` -- eso es consistente con la
    MECÁNICA que pide este caso (un campo, coma-separado), pero el
    contenido de esos dos valores concatenados no parece ser 2 categorías
    reales (uno es un show de 1 sola categoría real: "Acción, Crimen,
    Horror"). Podría ser la misma causa raíz que AN-02, no un caso
    aparte -- confirmar con un show que tenga categorías múltiples reales
    para aislarlo bien.

    RECONFIRMACIÓN 2026-09-15 (noche) -- se encontraron y confirmaron 2
    shows con géneros múltiples REALES en su propia ShowPage: "Exatlón
    Décima Temporada" ("Aventura, Juegos" -- 2 géneros) y "La Granja VIP
    Segunda Temporada" ("Exterior, Deportes y Recreación, Juegos" -- 3
