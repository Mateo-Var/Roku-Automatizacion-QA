# Escenarios compartidos (Core) — Analytics GA4: parámetros `plataforma` y `category`
#
# Ver scenarios/shared/README.md para la convención de `area`/`severity`/`status`.
#
# AUTOMATIZACIÓN DISPONIBLE (2026-09-17): scripts/test-vod-analytics.ps1 es un
# test de regresión para un defecto conocido del Player SDK en la ruta de
# preroll/ads (RAF): si el player no observa RAFPlayerTask.currentState, faltan
# eventos clave de analytics (buffering, video_views) y la escena nunca llega
# a "playing". Complementa esta batería (que valida `plataforma`/`category`)
# con un chequeo distinto: que el arranque real con ads se reporte. Correr con:
#   pwsh scripts/test-vod-analytics.ps1 -RokuHost 192.168.1.186
# Pendiente: primera corrida real post-integración.
#
# Origen: validación del PR https://github.com/mediastream/ott-next-core-roku-tv/pull/173
# (Monday, tarea "Solicitud de agregar parámetros a GA4 category y plataforma",
# abierta desde abril 2026, rebotada el 28-jul por falta de credenciales GA4,
# root-cause diagnosticado por el usuario mismo el 14-sep: `platform` vs
# `plataforma` en la key equivocada, `categories` vs `category` en plural).
#
# Combina las 2 tablas de casos QA del ticket:
#   - Tabla del PR-173 (QA-01..QA-08, [qa-bot:pr-173]) -- la más específica,
#     describe el fix real: plataforma = valor FIJO "TV Azteca En Vivo Roku"
#     (nombre de la OTT + "Roku"), category = key singular.
#   - Tabla de "Next Bot" (QA-01..QA-10, posterior) -- fraseo más genérico
#     ("dispositivo real" en vez de un string fijo, categorías múltiples
#     separadas por coma). Puede ser una versión más nueva/auto-generada
#     del mismo requerimiento, o aplicar a un ticket más amplio
#     multi-plataforma -- NO asumir cuál es la correcta si divergen en la
#     práctica, documentar la discrepancia tal cual se observe.
#
# PRERREQUISITO CRÍTICO (mismo bloqueo del 28-jul): sin `ga4ApiSecret` y
# `ga4MeasurementId` cargados en appConfig.json, el nodo de analytics
# (`m.global.RSG_analytics`) nunca se crea y NINGÚN evento se emite -- si
# esto vuelve a pasar, todos los escenarios de acá abajo van a fallar por
# la misma causa raíz de siempre, no por un bug nuevo. Confirmar PRIMERO
# (antes de correr cualquier escenario) que aparecen líneas
# `GA4 Initialize` / `ROKU_GA4` en el log -- si no aparecen, PARAR y
# reportar el mismo bloqueo, no seguir validando casos a ciegas.
#
# Metodología: esto es casi 100% validable por LOG -- cada evento GA4 es
# un JSON completo visible en el telnet log (`ROKU_GA4 INFO : POST {...}`)
# con todos los parámetros. Rara vez hace falta captura para esto -- el
# log ES la evidencia principal, no un sustituto del log.

- id: AN-01
  status: >
    CONFIRMADO PASA -- corrida VALIDACION-PR173-20260915 contra .186.
    Evento player_ready real ("Lotería del Crimen"):
    `"plataforma":"TV Azteca En Vivo Roku"`, SIN key `platform` en el
    payload. Fix correcto. Evidencia: telnet.log línea 959.
  title: "player_ready (VOD): plataforma correcta, sin key 'platform' residual"
  area: [core-network]
  severity: blocker
  screen: Player (VOD)
  steps:
    - Reproducir un VOD
    - Capturar el evento `player_ready` completo del log (`ROKU_GA4 INFO : POST {...}`)
  expected:
    - 'El JSON del evento trae `"plataforma":"TV Azteca En Vivo Roku"` (o el valor real que identifique el dispositivo, si la tabla de Next Bot aplica -- documentar cuál de las dos formas se observa)'
    - NO debe existir la key `platform` (sin la "a" final) en el payload -- era el bug original
  logs_watch:
    - 'Buscar el evento exacto `"name":"player_ready"` y extraer su objeto `params` completo'
  visual_check: null

- id: AN-02
  status: >
    🟡 PARCIAL -- la MECÁNICA del fix funciona (key `category` singular
    presente, SIN key `categories` residual -- eso está bien). PERO el
    VALOR es sospechoso: llegó `"category":"CMS, Lotería del Crimen"`.
    Confirmado contra la propia ShowPage de este show (ver
    reports/azteca/navegacion/CORRIDA-FORMAL-20260915-2200/30-fav-toggled-loteria.jpg)
    que el género real es "ACCIÓN, CRIMEN, HORROR" -- NO coincide. El
    valor real repite el título del show dentro del campo de categoría en
    vez de traer el género real. Reproducido igual en video_views (ver
    AN-03), 3/3 ocurrencias idénticas -- no es un glitch aislado.
    HALLAZGO A REPORTAR: el fix de la KEY está bien, pero el VALOR que
    arma la función de categoría parece tomar el dato equivocado del
    backend (o concatenar mal "CMS" + título en vez de los géneros
    reales). Evidencia: telnet.log línea 959.

    RECONFIRMACIÓN 2026-09-15 (noche, 2do show) -- NO SE REPITE IGUAL:
    con "La Granja VIP Segunda Temporada" (género real confirmado en su
    propia ShowPage: "EXTERIOR, DEPORTES Y RECREACIÓN, JUEGOS" -- ver
    captura `11-showpage-granja.jpg`), el `player_ready` real capturado
    trajo `"category":"not-set"` -- NO repitió el patrón "CMS, Título" de
    Lotería del Crimen, sino que directamente no trae el género real (ni
    tampoco el bug del título). Confirma que el bug de category es un
    problema GENERAL del fix (el valor real casi nunca llega bien), pero
    su síntoma concreto VARÍA por show/contenido: a veces concatena mal
    "CMS + título" (Lotería del Crimen), a veces cae en "not-set" a pesar
    de que el show sí tiene géneros reales asignados (La Granja VIP). Se
    intentó primero con "Exatlón México/Décima Temporada" (género real
    "AVENTURA, JUEGOS", también visible en ShowPage) pero sus 2 episodios
    probados fallaron para reproducir (`code:403 reason:"Forbidden"` en
    `MediaStreamPlayerAPI.brs(68)` -- error de contenido/DRM, no
    relacionado a category) -- sí alcanzaron a emitir `player_ready` antes
    de fallar, y esos también trajeron `category:"not-set"` (ver
    telnet.log líneas 171, 294 de esta corrida). Evidencia completa:
    `reports/azteca/analytics/RECONFIRMACION-CATEGORY-20260915-2300/telnet.log`
    (línea 462 para el player_ready real de La Granja VIP).
  title: "player_ready (VOD): category en singular, sin key 'categories' residual"
  area: [core-network]
  severity: blocker
  screen: Player (VOD)
  steps:
    - Mismo evento `player_ready` de AN-01 (no repetir la reproducción, reusar la misma corrida)
    - Revisar el parámetro de categoría
  expected:
    - 'Existe la key `"category"` (singular) con el nombre real de la categoría del contenido reproducido'
    - NO debe existir la key `categories` (plural) -- era el bug original (GA4 la descarta en silencio si la dimensión está registrada en singular)
  logs_watch:
    - 'Mismo evento player_ready que AN-01 -- confirmar `category` presente y `categories` ausente'
  visual_check: null

- id: AN-03
  status: >
    🟡 PARCIAL -- player_ready y video_views confirmados (mismo evento de
    "Lotería del Crimen" cubre esto, es un episodio de Show): ambos con
    `plataforma` correcto y el mismo `category:"CMS, Lotería del Crimen"`
    sospechoso de AN-02. `screen_view` de la entrada al Player específica
    de este episodio no se aisló explícitamente en esta corrida (se
    cortó antes) -- pendiente confirmar ese evento puntual, aunque los
    screen_view generales ya vistos (Home/Discovery/Search) sí tienen
    plataforma correcto.

    RECONFIRMACIÓN 2026-09-15 (noche, 2do show) -- ✅ COMPLETO con
    "La Granja VIP Segunda Temporada" (episodio real de Show, video 209,
    "Se los voy a aventar a la cama..."): los 3 eventos capturados en la
    misma ventana de tiempo -- `screen_view` (screen_name:"Player",
    telnet.log línea 450), `player_ready` (línea 462), `video_views`
    (línea 656) -- los 3 con `plataforma:"TV Azteca En Vivo Roku"`
    correcto, y los 3 con `category:"not-set"` (NO el género real
    "Exterior, Deportes y Recreación, Juegos" visto en su ShowPage). Bonus
    no pedido: también se capturó `video_VOD_progress` 2 veces (25% y 50%,
    ver AN-07) con el mismo patrón -- plataforma correcto, category
    "not-set". Confirma consistencia interna del bug (todos los eventos de
    una misma reproducción coinciden entre sí), aunque el valor en sí
    sigue sin ser el género real.
  title: "Episodio de Show: screen_view + player_ready + video_views, los 3 con plataforma y category correctos"
  area: [core-network]
  severity: major
  screen: ShowPage -> Player (episodio)
  steps:
    - Reproducir un episodio de un Show (no un VOD suelto)
    - 'Capturar los 3 eventos en el log -- screen_view (al entrar al player), player_ready, video_views'
  expected:
    - Los 3 eventos traen `plataforma` correcto (mismo criterio que AN-01)
    - Los 3 eventos traen `category` con el nombre real de la categoría del episodio (mismo criterio que AN-02)
  logs_watch:
    - 'Los 3 nombres de evento deben aparecer en la ventana de tiempo de esta reproducción, cada uno con su propio params completo'
  visual_check: null

