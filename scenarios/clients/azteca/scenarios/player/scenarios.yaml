- id: SC-SHOW-01
  title: Detalle de show y reproducción
  area: [player, core-network, core-ui]
  severity: blocker
  screen: ShowPage -> EpisodeDetailPage -> Player
  steps:
    - Lanzar el canal desde cero (cold start)
    - Entrar al show enfocado en Home
    - Bajar en la lista
    - Bajar en la lista otra vez
    - Moverse a la derecha
    - Seleccionar episodio
    - Pausar con Play
    - Reanudar con Play
  expected:
    - Video arranca sin buffering excesivo
    - Controles responden (play/pause/seek)
  logs_watch:
    - Sin errores del Player embebido (buffering infinito, DRM fail)
    - roUrlTransfer del manifest/licencia resuelve OK
  visual_check: screenshot del player en reproducción (validar que no haya pantalla negra/verde)
  status: >
    CONFIRMADO 2026-09-17 contra device .63 (batería PLAYER formal). Cold
    start real confirmado (HomePage:Init fresco, login_status:connected,
    mismo IM 30f41b94...). Entró al show "Acércate a Rocío" desde Home
    (Down x2 + Right + Select), Down x2 + Right + Select adicional entró a
    la categoría de episodios y seleccionó uno. episode/<ID>.json llegó con
    ID poblado (SC-PLAYER-BUG-01 NO se reprodujo esta corrida). Solo 1
    transición buffering->playing (VODStartComplete 3925ms), sin DRM fail
    ni errores del Player embebido. Play pausó (RAFPlayerTask: state =
    paused) y Play de nuevo reanudó (state = playing) sin problema.
    Hallazgo incidental (no nuevo): al navegar Right desde el hero se
    presionó Select sobre el ícono de favorito en vez de la lista de
    episodios, reproduciendo una vez más el bug ya conocido
    ShowPage.brs(1086) (roSGNode.AddReplace Type mismatch) -- no afecta el
    veredicto de este escenario, ya está documentado aparte. Evidencia:
    reports/azteca/player/CORRIDA-device63-20260917/telnet.log (líneas
    1-420 aprox.), 01-show-navigate-focus.jpg, 02-showpage-after-select.jpg,
    03-player-playing.jpg.

    RE-CONFIRMADO (2026-09-18, device 192.168.1.54, build v1.24.92609040) --
    PASA. Cold start real (Home + launch/dev). Desde Home, Down x2 llegó al
    riel "MicroDramas" con el show "Historias de Vida" (PROGRAMA DE
    TELEVISIÓN) -> Select -> ShowPage ("HISTORIAS DE VIDA.", "2
    TEMPORADAS", Episodios T2/T1). Reproducción vía VER AHORA (hero):
    query/media-player = state="play", error="false", is_live=false (VOD),
    container=hls, duration ~1232s (~20min), bitrate ~1.77 Mbps, position
    avanzando, drm="none" -- sin buffering excesivo ni DRM fail. Pausa/
    reanudar confirmado por ECP: Play -> state="pause", Play -> state="play".
    0 excepciones BrightScript (Backtrace/Unhandled/ERROR) en el log.
    Nota de navegación (no bug): al intentar entrar por la lista de
    episodios (Down+Right+Select) el foco cae primero en la pestaña "Acerca
    de este contenido"; se usó VER AHORA para reproducir. Evidencia:
    reports/azteca/2026-09-18_18-00-player/{logs/SC-SHOW-01.log,videos/SC-SHOW-01.mp4,screenshots/SC-SHOW-01-01..03-*.jpg}

- id: SC-PAYWALL-01
  title: Contenido restringido por suscripción
  area: [core-network, core-ui]
  severity: major
  screen: PaymentRequiredPage
  steps:
    - Intentar reproducir contenido premium sin suscripción activa
  expected:
    - Redirige/muestra PaymentRequiredPage, nunca reproduce el contenido
  logs_watch:
    - '"purchased" tratado como entero (1), nunca como boolean (regla del Core)'
  status: >
    SIN CONFIRMAR, mismo estado que sesiones previas (2026-09-17, batería
    device .63). Se revisó test-data/azteca.json (sin ningún contenido
    marcado como premium/paywalled) y se recorrió Home brevemente sin
    encontrar ningún badge de candado/suscripción. Consistente con el
    hallazgo ya documentado (AC-UL-04, PROJECT_MEMORY.md): no se ha
    encontrado ningún contenido del catálogo de Azteca que gatee por
    suscripción en esta cuenta de prueba. No se puede ejecutar el escenario
    tal como está redactado sin identificar primero un ítem realmente
    restringido -- queda abierto, no es un "PASA" fabricado.

    ACTUALIZACIÓN IMPORTANTE 2026-09-18 (device 192.168.1.54, build
    v1.24.92609040) -- POR FIN SE IDENTIFICÓ CONTENIDO RESTRINGIDO, pero el
    manejo es un BUG, no una PaymentRequiredPage. El show "Exatlón México"
    (Top 10 #1 de Home) devuelve HTTP 403 en el endpoint de stream-data
    (`issuccess:false, reason:"Forbidden"`) tanto ANÓNIMO como logueado con
    la cuenta de prueba qa.tester@example.com, en Programas completos
    y en Mejores momentos -- o sea, todo el show está gateado por
    entitlement/suscripción que la cuenta de prueba no tiene. PERO en vez
    de redirigir a PaymentRequiredPage (lo que este escenario espera), el
    SDK del player hace `ParseJSON` del string "Forbidden" y lanza
    `BRIGHTSCRIPT: ERROR: ParseJSON: Unknown identifier 'Forbidden':
    mediastreamrokuplayersdk:/source/apis/MediaStreamPlayerAPI.brs(68)`,
    luego `closePlayer` SILENCIOSO (vuelve a la ShowPage sin ningún
    mensaje). Es decir: el expected de este escenario ("Redirige/muestra
    PaymentRequiredPage, nunca reproduce") se cumple a medias -- NUNCA
    reproduce (bien) pero NO muestra PaymentRequiredPage ni ningún aviso
    (mal). FALLA la parte de UX/expected + expone el bug de ParseJSON.
    Detalle completo y evidencia en SC-PLAYER-CONTENT-MATRIX-01 (Case A) y
    reports/azteca/2026-09-18_18-00-player/{logs/SC-PLAYER-CONTENT-MATRIX-01.log,screenshots/SC-MATRIX-01-04..11-*.jpg}.
    Reportar al equipo de Core/Player junto con el resto de hallazgos.

- id: SC-PLAYER-BUG-01
  title: "[BUG confirmado, condición de carrera] ParseJSON crash al entrar al Player por selección manual de episodio"
  area: [player, core-network]
  severity: major
  screen: Player, al entrar desde ShowsPage/SeasonListView
  found_on: 2026-09-11 (observación manual + confirmado con prueba dirigida, next-episode-test.log)
  root_cause_confirmed: >
    ACTUALIZADO tras 2 sesiones de prueba (8 transiciones de episodio en
    total): NO es 100% determinístico por el método de selección -- es una
    condición de carrera. Datos acumulados: selección manual
    (SeasonListView + OK) 2 de 3 veces con bug; "Up Next" (con OK explícito
    o autoplay por timeout, sin tecla) 0 de 5 veces con bug. El patrón que
    SÍ se sostiene: el bug NUNCA apareció en ninguna variante de "Up Next",
    solo puede aparecer en selección manual (pero no siempre). Hipótesis
    sin cambios: al entrar por Up Next, el Player ya trae el ID del
    próximo episodio resuelto (campo "next" del JSON del episodio
    anterior) de forma síncrona; al entrar por selección manual, hay una
    carrera entre el registro de métricas de ads
    (postRequest .../metrics.mdstrm.com/inbound/v1/event/register/) y la
    asignación de esa variable de ID -- que a veces gana la carrera (sin
    bug) y a veces no (bug). Necesita más muestras para estimar el % real
    de reproducción en selección manual.
  steps:
    - Desde ShowsPage, entrar a una temporada (SeasonListView)
    - Seleccionar CUALQUIER episodio con OK (no usar Up Next)
  expected:
    - "BaseRequests : getRequest url : https://mdstrm.com/episode/<ID>.json (con ID poblado)"
  actually_observed:
    - "postRequest .../metrics.mdstrm.com/inbound/v1/event/register/"
    - "BaseRequests : getRequest url : https://mdstrm.com/episode/.json (ID vacío)"
    - "HTTP 404 'Not found' (texto plano, no JSON)"
    - "BRIGHTSCRIPT: ERROR: ParseJSON: Unknown identifier 'Not found': mediastreamrokuplayersdk:/source/apis/MediaStreamPlayerAPI.brs(67)"
  logs_watch:
    - Buscar exactamente el patrón "episode/.json" (ID vacío entre / y .json)
    - Buscar "ParseJSON: Unknown identifier" en cualquier .brs del Player SDK
  control_case:
    - Transición por "Up Next" (autoplay), 3/3 veces sin este error -- usar
      como caso de control al reportar el bug (aísla que el problema es del
      path de selección manual, no del Player en general).
  regression_note: >
    A pesar del error, la reproducción continúa (no crashea la app) --
    severidad "major" y no "blocker" por eso, pero es un error no manejado
    que viola el patrón "errors are values, not exceptions" que exige
    Library/source/apis en el Core.
  status: >
    RE-CONFIRMADO consistente con la naturaleza intermitente ya documentada
    (2026-09-17, device .63). 3 selecciones manuales de episodio distintas
    en esta corrida (Acércate a Rocío, Venga La Alegría x2) -- las 3 con
    `episode/<ID>.json` con ID poblado, SIN reproducir el bug esta vez
    (0/3). No contradice el hallazgo previo (condición de carrera, no
    determinística, ~2/3 en muestra acumulada anterior de 8 transiciones)
    -- simplemente esta muestra salió del lado "sin bug". Evidencia:
    reports/azteca/player/CORRIDA-device63-20260917/telnet.log líneas
    ~550-970.

# RELACIÓN CON scripts/test-player-multipress.ps1 (NO es el mismo caso, no
# fusionar): el check "Ver ahora" de SC-FLOW-STRESS-01 de abajo (antes
# SC-VERAHORA-RAPID-CRASH-01) es el botón "Ver ahora" del hero de ShowPage
# específicamente, reportado por el usuario 2026-09-16 y todavía sin
# confirmar por el agente. test-player-multipress.ps1 es un test de
# REGRESIÓN AUTOMATIZADO y PERMANENTE de un abuso relacionado pero distinto
# -- OK repetido en general (no acotado al botón del hero) -- sobre 2 bugs
# YA CONFIRMADOS y documentados en build azteca v1.18.92608240 (2026-09-04):
# Bug A (N OK rápidos crean N instancias de MediaStreamPlayer, puede colgar
# la app en el Micro Debugger) y Bug B (tras el abuso, el id de contenido se
# pierde y nada reproduce hasta reiniciar la app). Ambos bugs son de
# "abusar del botón de reproducir", pero uno es el hero de ShowPage (este
# escenario) y el otro es el flujo general de reproducir (ese script).
# OBLIGATORIO: test-player-multipress.ps1 se corre SIEMPRE en cada pasada de
# la batería de player, sin excepción y sin degradar su prioridad aunque se
# parezca conceptualmente al check de "Ver ahora" -- es la única forma de
# detectar si el bug ya arreglado vuelve a aparecer en un build nuevo.
#   pwsh scripts/test-player-multipress.ps1 -RokuHost 192.168.1.186
#   pwsh scripts/test-player-multipress.ps1 -Test A -OkCount 3 -OkIntervalMs 150
# Ver el propio script para el detalle completo de los 2 bugs y por qué son
# 2 tests separados en vez de uno.

- id: SC-FLOW-CONTROLS-01
  title: "[FLOW -- consolida 13 casos ex VI-PC/VI-SY/CO-US en una sola reproducción] Controles básicos del player: foco, carga, seek, pausa, subtítulos, remoto, spam, extremos"
  area: [player, core-ui]
  severity: major
  screen: Player (una sola sesión continua de reproducción)
  steps:
    - "1. Foco por defecto (ex SC-PLAYER-DEFAULT-FOCUS-01): entrar a reproducir cualquier contenido, y en cuanto aparezcan los controles del skin (sin tocar nada todavía), confirmar visualmente cuál botón tiene el foco"
    - "2. Controles durante la carga (ex SC-PLAYER-CONTROLS-LOADING-01, VI-PC-01): mientras el video todavía está cargando/con el spinner visible, presionar Play/Pause, luego Fwd, luego Rev, luego Back -- cada uno por separado, confirmando que la app no se congela y que Back cancela la carga y vuelve"
    - "3. Seek básico (ex SC-PLAYER-SEEK-01, VI-PC-02): con el video reproduciendo normal, Fwd una vez, confirmar UI de scrub (filmstrip), confirmar con Select, repetir con Rev -- confirmar ritmo razonable de avance/retroceso (tabla x1/x2/x3/x5 ya documentada) y que no hay buffering excesivo ni reinicio no solicitado"
    - "4. Multi-click en seek (ex SC-PLAYER-SEEK-MULTICLICK-01, VI-PC-03): Fwd 8-10 veces seguidas rápido sin pausar, observar resultado; repetir con Rev -- sin freeze, sin crash, sin buffering infinito"
    - "5. Pausar durante el scrub (ex SC-PLAYER-PAUSE-DURING-SEEK-01, VI-PC-04): Fwd para entrar en modo scrub sin confirmar, presionar Play/Pause y documentar qué pasa; repetir con Back en medio del scrub"
    - "6. Pause vs Stop (ex SC-PLAYER-STOP-PAUSE-01, VI-PC-05): Play/Pause confirma que SOLO pausa (no cierra el player), Play/Pause de nuevo reanuda sin buffering largo, Back sale del player limpio y rápido a la pantalla de origen (ShowPage, no Home a ciegas)"
    - "7. Controles no se bloquean entre sí (ex SC-PLAYER-CONTROL-STATE-01, VI-PC-06): Play/Pause y, sin esperar la transición visual, Fwd inmediatamente después -- confirmar que Fwd responde igual, sin quedar 'trabado'"
    - "8. AV sync (ex SC-PLAYER-AVSYNC-01, VI-SY-01): reproducir varios minutos prestando atención a sync audio/video, hacer un par de seeks y confirmar que el audio sigue sincronizado después (caso mayormente observacional, dejar nota de confiabilidad de la validación)"
    - "9. Subtítulos sincronizados (ex SC-PLAYER-SUBTITLES-SYNC-01, VI-SY-02): con subtítulos activos, confirmar con capturas en distintos momentos que el texto corresponde al momento real del video"
