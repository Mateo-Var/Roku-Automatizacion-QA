- id: SC-FAV-INSTANT-01
  status: >
    CONFIRMADO -- corrida CORRIDA-EXTENDIDA-device63-20260915 contra
    192.168.1.63 (device DISTINTO al habitual .186, Streaming Stick 4K).
    Confirmado con "Lotería del Crimen": marcar desde ShowPage (Discover)
    -> aparece INSTANTÁNEO en FavoritePage sin refrescar (capturas 47-48)
    -> entrar desde Favoritos lleva a la ShowPage correcta (mismo título,
    capturas 48-49) -> desmarcar -> desaparece instantáneo (confirmado en
    corrida de stress test, ver SC-FAV-TOGGLE-STRESS-01 en
    scenarios/shared/navegacion/estres/scenarios.yaml). El toggle SIGUE
    disparando la excepción BrightScript ya conocida en cada acción (ver
    detalle de línea de código abajo). Solo se cubrió 1 show completo (no
    3) por prioridad de tiempo en esta corrida -- el patrón ya es
    consistente con lo documentado en 6/6 corridas previas contra .186, no
    se considera necesario repetir con 3 shows más para confirmar el
    comportamiento base.
    ---
    🆕 HALLAZGO NUEVO en este device (.63), no visto antes en .186: el
    show "Exatlón Décima Temporada" (entrado desde Discover Y desde
    Search) NO permite marcar como favorito -- en su lugar, el intento
    dispara `BRIGHTSCRIPT: ERROR: ParseJSON: Unknown identifier
    'Forbidden': mediastreamrokuplayersdk:/source/apis/MediaStreamPlayerAPI.brs(68)`
    y la navegación rebota (Player -> Search/Discovery -> Show) SIN marcar
    el favorito. Reproducido 2/2 veces con el mismo show, mismo video_id
    (`6aa055ae4b2e1983cbf8ae7d`). Confirmado que NO quedó en Favoritos tras
    el intento (captura 45). Distinto del bug conocido de
    `ShowPage.brs(1087)` -- este es un error de API/contenido (HTTP
    Forbidden mal manejado por el Player SDK), no del toggle de favorito
    en sí. Hipótesis: el contenido tiene una restricción de acceso
    (geo/DRM/entitlement) que el SDK no maneja con gracia -- necesita
    confirmarse si es específico de este show o de cualquier contenido
    restringido. Severidad sugerida: major (rompe una función completa
    para el usuario, sin mensaje de error visible, solo rebote silencioso).
  title: Marcar/desmarcar favorito refleja al instante, con 3 shows distintos, y acceder desde Favoritos lleva al show correcto
  area: [core-network, core-ui]
  severity: major
  screen: ShowPage / FavoritePage
  steps:
    - "Con el show 1 (de una categoría): entrar a ShowPage, marcar favorito, ir INMEDIATAMENTE a FavoritePage (sin esperar/refrescar) y confirmar que ya aparece"
    - Desde FavoritePage, seleccionar ese show y confirmar que navega a la ShowPage CORRECTA (mismo título que se marcó, no otro show, no pantalla en blanco)
    - Volver, desmarcar el favorito (desde ShowPage o FavoritePage), confirmar que desaparece de FavoritePage al instante
    - Repetir el mismo flujo completo con el show 2 (categoría distinta al 1)
    - Repetir el mismo flujo completo con el show 3 (categoría distinta a 1 y 2)
  expected:
    - El cambio (agregar/quitar) se refleja en FavoritePage sin necesidad de refrescar/relanzar la app, en los 3 casos
    - Acceder a un show desde FavoritePage siempre lleva a la ShowPage correcta correspondiente a ESE show, nunca a otro ni a una pantalla rota
    - Comportamiento consistente entre los 3 shows probados, sin importar su tipo (serie/podcast/documental)
  logs_watch:
    - 'screen_name:"Favorite" tras marcar debe reflejar el nuevo estado sin re-lanzar la app'
    - 'Al entrar desde FavoritePage, confirmar por log/program que el show que carga es el correcto (mismo título/ID que el marcado)'
    - 'Es esperable que dispare la excepción ya conocida ShowPage.brs(1087) en cada toggle -- no es el foco de este escenario, no repetir el análisis, solo anotar si aparece'
  visual_check: captura de FavoritePage justo después de marcar cada uno de los 3 (confirma que aparece sin refrescar), y de la ShowPage correcta al entrar desde Favoritos

- id: SC-SHOW-DUPLICATE-SELECT-01
  status: >
    CONFIRMADO -- corrida CORRIDA-EXTENDIDA-device63-20260915 contra
    192.168.1.63 (device distinto al habitual .186). Ráfaga de 5 Select
    rápidos (150ms entre cada uno) sobre "Lotería del Crimen" enfocado en
    Discover: solo 1 `screen_name:"Show"` real se disparó (log limpio, sin
    duplicados), la ráfaga extra de Selects fue absorbida por el foco ya
    posicionado en "VER AHORA" dentro de la ShowPage y lanzó el Player
    (comportamiento esperado del control, no una instancia duplicada de
    ShowPage). Back x1 volvió del Player a la Show (1 paso), Back x2 volvió
    de Show a Discovery (1 paso) -- sin necesitar múltiples Back para
    "destrancar" nada, sin pantallas apiladas. Sin crash, sin freeze,
    mando responsivo en todo momento. Captura 60 confirma Discovery en
    estado limpio tras la secuencia completa.
  title: Seleccionar un show varias veces rápido no crea instancias duplicadas de la pantalla
  area: [core-ui]
  severity: major
  screen: ShowPage
  steps:
    - Desde un riel de Home o Discover, con un show enfocado, presionar Select varias veces seguidas y rápido (simular doble/triple toque accidental) antes de que la pantalla termine de cargar
    - Observar el log para contar cuántas veces se dispara `ShowPage : Init` / `screen_name:"Show"` para esa única acción del usuario
    - Presionar Back una vez y confirmar a dónde vuelve (debería ser directo al riel de origen, no quedar atrapado entre "copias" apiladas de ShowPage)
  expected:
    - No debería instanciarse la pantalla más de una vez por la selección múltiple rápida (o si el framework la re-crea, Back debe volver en UN solo paso al origen, no requerir varios Back para "destrancar" pantallas duplicadas)
    - Sin crash, sin freeze, sin quedar con el mando sin responder
  logs_watch:
    - 'Contar ocurrencias de "ShowPage : Init" inmediatamente después de la ráfaga de Select -- más de 1 con el mismo contenido es la señal de una instancia duplicada'
  visual_check: captura tras la ráfaga (confirmar una sola ShowPage visible, no un layout roto/superpuesto) y tras el primer Back

