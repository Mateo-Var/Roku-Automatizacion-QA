    distinto) y el foco NUNCA desapareció.
  title: El foco no desaparece ni queda atrapado en los bordes de una lista
  area: [core-ui]
  severity: minor
  screen: HomePage (rieles) / cualquier lista larga
  steps:
    - Navegar hasta el primer ítem del primer riel de Home (arriba a la izquierda) y seguir presionando Up/Left varias veces de más, más allá del borde
    - Navegar hasta el último ítem de un riel largo y seguir presionando Right varias veces de más
    - En ambos casos, confirmar que el foco sigue siendo visible y en un ítem real, no desaparecido
  expected:
    - El foco nunca desaparece de la pantalla
    - Presionar de más en un borde no rompe la navegación (se queda quieto ahí, o hace algo predecible como pasar a otro riel -- pero siempre con foco visible)
  logs_watch:
