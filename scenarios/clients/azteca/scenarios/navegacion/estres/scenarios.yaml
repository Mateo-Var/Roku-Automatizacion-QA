- id: SC-FAV-TOGGLE-STRESS-01
  status: >
    🔴 HALLAZGO REAL CONFIRMADO -- corrida CORRIDA-EXTENDIDA-device63-20260915
    contra 192.168.1.63 (device distinto al habitual .186, primera corrida
    de este escenario). Sobre "Lotería del Crimen" (estado inicial: NO
    favorito, confirmado), 6 toggles rápidos del corazón (250ms entre cada
    uno) -- las 6 excepciones BrightScript ya conocidas
    (`ShowPage.brs(1086)`, ver SC-FAV-01) se dispararon 1:1 con cada
    toggle (confirmado por conteo exacto en el log). El ícono del corazón
    en la ShowPage QUEDÓ MOSTRANDO VACÍO (no favorito) inmediatamente
    después de la ráfaga (captura 56) -- consistente con 6 toggles (par)
    desde un estado inicial "no favorito". PERO al navegar a FavoritePage
    inmediatamente después, "Lotería del Crimen" SEGUÍA apareciendo como
    favorito (captura 58) -- **inconsistencia real entre lo que muestra el
    ícono en ShowPage y el estado realmente persistido**. Al volver a
    entrar a la ShowPage con una carga fresca (no cacheada), el corazón
    mostró CORRECTAMENTE el estado real (favorito, sólido -- captura 59).
    Conclusión: el ícono de favorito en ShowPage puede quedar
    visualmente desincronizado del estado real persistido tras un toggle
    en ráfaga, hasta que la página se recarga fresca -- el dato
    persistido en sí es correcto (Favoritos es la fuente de verdad
    correcta), pero la UI de ShowPage puede mentir sobre el estado actual
    sin refrescar. Esto es DISTINTO y ADICIONAL al bug ya conocido de la
    excepción `ShowPage.brs(1086/1087)` -- ese es un error no manejado que
    no rompe la función; ESTE es un desync visual real que sí puede
    confundir al usuario (cree que no está en favoritos cuando sí lo
    está). Severidad sugerida: major (afecta la confianza del usuario en
    el estado mostrado, aunque el dato de fondo esté bien). Recomendado
    para reportar junto con el hallazgo de Exatlón (SC-FAV-INSTANT-01).
  title: Marcar/desmarcar favorito en ráfaga termina en un estado final consistente
  area: [core-network, core-ui]
  severity: major
  screen: ShowPage / FavoritePage
  steps:
    - Sobre un show, presionar el botón de favorito (Select sobre el corazón) 6-8 veces seguidas y rápido, alternando marcar/desmarcar
    - Esperar a que se estabilice, revisar el estado final del ícono en ShowPage
    - Ir a FavoritePage y confirmar si el show aparece o no ahí
  expected:
    - El estado final del corazón en ShowPage debe COINCIDIR con si el show aparece o no en FavoritePage -- no debe quedar inconsistente (ej. corazón lleno pero no está en Favoritos, o viceversa)
    - Sin crash pese al toggling rápido
  logs_watch:
    - Contar cuántos toggles reales se registraron en el log vs. cuántos se enviaron -- si se pierden algunos, entender si eso explica una posible inconsistencia final
    - Es esperable que dispare la excepción ya conocida ShowPage.brs(1087) en cada toggle -- no repetir ese análisis, solo confirmar que no impide llegar a un estado consistente

- id: SC-FOCUS-EDGES-01
