  visual_check: captura en cada borde probado, después de la ráfaga de más

- id: SC-MULTI-ENTRY-SHOW-01
  status: >
    CONFIRMADO -- corrida CORRIDA-EXTENDIDA-device63-20260915 contra
    192.168.1.63 (device distinto al habitual .186, primera corrida de
    este escenario). Show usado: "Exatlón Décima Temporada" (2 entradas
    cubiertas, no 3 -- no se encontró en Home por ser el hero/riel de Home
    contenido 100% de tipo Live/Player directo en este device, sin
    ShowPage intermedia -- ver nota abajo). Entrada 1 (Discover, fila
    "Realities y concursos"): estado del corazón vacío (no favorito),
    Back -> vuelve a Discovery (origen correcto). Entrada 2 (Search,
    "exatlon decima"): mismo estado del corazón (vacío, consistente), Back
    -> vuelve a Search (origen correcto, NO a Home). Ambas entradas
    confirmadas con captura + log `screen_name` antes/después. Nota
    operativa: la primera vez que se probó esto el Back pareció volver a
    "Home" en vez de "Discovery" -- investigado y descartado como bug: fue
    contaminación metodológica propia (navegación previa ambigua, no una
    entrada limpia desde Discovery) -- repetido con pasos verificados paso
    a paso y el comportamiento fue correcto las 2 veces limpias.

    RE-CONFIRMADO (2026-09-18, device 192.168.1.54, build v1.24.92609040) --
    PASA de nuevo, la regla de "Back vuelve al origen real" se re-confirma
    en el device habitual actual con 2 puntos de entrada distintos en la
    misma corrida:
    - Entrada A (Search): Buscar "exatlon" -> resultado "Exatlón Décima
      Temporada" (PROGRAMA DE TELEVISIÓN) -> ShowPage (Episodios/Acerca de
      este contenido/Relacionados, "13 TEMPORADAS") -> Back -> vuelve a
      "Resultados de la búsqueda" con el query intacto (origen correcto, NO
      Home).
    - Entrada B (Secciones/Discover): "Todas las categorías" -> show
      "Lotería del Crimen" (PROGRAMA DE TELEVISIÓN) -> ShowPage ("2
      TEMPORADAS", VER AHORA) -> Back -> vuelve a "Todas las categorías"
      con el mismo ítem enfocado (origen correcto, NO Home).
    En ambas ShowPages de este build/device la vista principal no expone un
    corazón de favorito prominente (el estado de favorito ya quedó cubierto
    exhaustivamente en la corrida .63); el foco de esta re-confirmación fue
    la regla Back->origen, que PASA. Evidencia:
    reports/azteca/2026-09-18_17-25-navegacion/{logs/SC-MULTI-ENTRY-SHOW-01.log,videos/SC-MULTI-ENTRY-SHOW-01.mp4,screenshots/SC-MULTI-01-01..12-*.jpg}
    🔍 Nota aparte (no bug, hallazgo de arquitectura): en este device/build,
    los ítems del riel EN VIVO y "Continuar viendo" de Home llevan
    DIRECTO al Player (Live o VOD resume), no a una ShowPage intermedia --
    a diferencia de items entrados desde Discover/Search que sí llevan a
    ShowPage primero. Por eso no se pudo usar "Entrada 3: desde el
    hero/riel de Home" tal como pedía el escenario originalmente -- ese
    riel específico no tiene una ShowPage que visitar antes del contenido.
  title: Entrar al mismo show desde 3 puntos distintos mantiene estado consistente y Back vuelve al origen correcto
  area: [core-ui]
  severity: minor
  screen: ShowPage (entrado desde Home hero, Discover, Search)
  steps:
    - "Entrada 1: desde el hero/riel de Home, entrar a un show -- anotar el estado del corazón de favorito, presionar Back, confirmar que vuelve a Home en el riel de origen"
    - "Entrada 2: buscar el MISMO show por Search, entrarlo desde ahí -- confirmar que el estado del corazón es el mismo que en la entrada 1 (consistente), presionar Back, confirmar que vuelve a SearchPage (no a Home)"
    - "Entrada 3: si el show aparece en Discover, entrarlo desde ahí -- mismo chequeo de estado + Back debe volver a Discover"
  expected:
    - El estado de favorito es el mismo sin importar desde dónde se entre (es el mismo show, mismo dato)
    - Back siempre vuelve a la pantalla de ORIGEN real desde donde se entró, no siempre a Home a ciegas
  logs_watch:
    - Confirmar por log el screen_name antes de entrar y después del Back -- deben coincidir

