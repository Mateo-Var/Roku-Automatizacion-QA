- id: SC-BACK-SPAM-01
  status: >
    CONFIRMADO -- corrida CORRIDA-EXTENDIDA-device63-20260915 contra
    192.168.1.63 (device distinto al habitual .186, primera corrida de
    este escenario en cualquier device). Navegación profunda real:
    Discover -> CategoryGridPage ("Regional News México") -> Show
    ("Zacatecas") -> show relacionado ("Yucatán") -- 4 niveles. Ráfaga de
    10 Back seguidos (150ms entre cada uno). Secuencia `screen_name`
    resultante coherente y sin saltos raros: Yucatán -> Zacatecas ->
    Category -> Discovery -> (backs restantes absorbidos, sin más
    retroceso posible ni error) -- terminó con el nav lateral abierto
    sobre Discovery, foco visible en "Secciones", sin overlap, sin
    congelamiento del mando, sin ninguna excepción BrightScript durante
    toda la ráfaga (captura 22).
  title: Back en ráfaga desde navegación profunda no crashea ni deja la app en estado roto
  area: [core-ui]
  severity: major
  screen: Múltiples (Home -> Discover -> Show -> show relacionado)
  steps:
    - Navegar profundo -- Home -> Discover -> entrar a un show -> entrar a un show relacionado desde "Relacionados" (2-3 niveles de profundidad)
    - Presionar Back 8-10 veces seguidas, rápido, sin pausar a observar entre toque y toque
    - Recién después de la ráfaga, revisar dónde terminó (log + captura)
  expected:
    - Sin crash de la app, sin que el remoto deje de responder
    - Termina en un lugar predecible (idealmente Home, o el banner de confirmación de salida si llegó al fondo del historial) -- no en una pantalla rota/en blanco/congelada
  logs_watch:
    - Sin excepciones BrightScript no manejadas durante la ráfaga
    - Secuencia de `screen_name` debería ser coherente con ir retrocediendo un paso genuino por cada Back, no saltos raros

