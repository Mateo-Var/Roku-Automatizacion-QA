    - Entrar a Discover ("Secciones"), listar TODAS las categorías visibles bajando/scrolleando hasta el final
    - Comparar 1:1 contra la sección de categorías del release.json -- ojo, Discover podría mostrar un set distinto al de los rieles de Home (Discover suele ser "todo el catálogo", Home suele ser curado) -- no asumir que son el mismo set, confirmarlo
