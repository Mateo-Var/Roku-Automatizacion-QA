    categoría contra el JSON, porque el JSON no las contiene. Ninguna
    categoría "fantasma" encontrada; "Short Dramas" confirmado como última
    categoría real (scroll hasta el final, capturas 13-15).
  title: Las categorías reales de Discover coinciden con el release.json vivo (puede diferir del set de Home)
  area: [core-network, core-ui]
  severity: major
  screen: DiscoverPage
  steps:
