    `hasAuth/hasSearch/hasDiscoverContent:true`, `hasPlayerLives/hasSports:false`.
    HALLAZGO IMPORTANTE sobre la estructura real del config: el
    release.json NO enumera las categorías de Discover de forma estática
    en ningún campo (`collections` está vacío `{}`, `layouts.Default`
    tiene solo `name`+`components` sin datos de categorías) -- las
