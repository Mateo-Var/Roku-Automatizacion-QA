    -- normal, es lag de red variable, no un requisito fijo. Recaptura 2s
    después (08-burst-plus2s.jpg) igual de correcta. Sin excepciones nuevas
    en el log.
    ---
    DONE (2026-09-15, exploración) -- PASÓ. Ráfaga de 8 "Right" seguidos
    sobre el riel EN VIVO: el foco terminó en un único tile correcto (sin
    duplicar ni perder el foco), sin romper el layout. Detalle MENOR
    observado (no bloqueante): justo tras la ráfaga, el hero de fondo
