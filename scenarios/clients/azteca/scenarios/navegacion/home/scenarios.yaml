- id: SC-HOME-HERO-01
  status: >
    CONFIRMADO -- corrida formal 2026-09-15, RECONFIRMADO sin divergencias:
    2 capturas separadas por 20s sin input (04-hero-t0.jpg / 05-hero-t20.jpg)
    pixel-idénticas, CERO líneas nuevas de log en esos 20s (confirmado
    contando líneas del telnet.log antes/después: 308/308). Al mover Right
    2 veces, el hero cambió instantáneamente a "Dramas de Familia"
    sincronizado con el tile (captura 06). Confirma 100% el hallazgo de la
    exploración: hero reactivo a foco, no slideshow con timer.
    ---
    DONE (2026-09-15, exploración) -- PASÓ, con hallazgo de comportamiento
    real documentado (no es un bug, es aclaración de cómo funciona): el
    hero de arriba de Home NO es un slideshow/carrusel automático -- es
    100% sincrónico con el foco del riel de canales EN VIVO justo debajo.
    Confirmado con 2 capturas separadas por 20s SIN tocar el control
    (01-home-hero-t0.jpg / 02-home-hero-hero-t20.jpg): pixel-idénticas, CERO
    rotación automática, y CERO líneas nuevas en el log durante esa espera.
    Al mover el foco manualmente con Right, el hero cambia
    instantáneamente (imagen, título, descripción, horario) sincronizado
    con el tile enfocado (captura 03). Esto contradice la sospecha inicial
    de "slideshow" -- no aplica ese concepto acá, es un hero reactivo al
    foco, no un carrusel con temporizador propio.
  title: Hero de Home es reactivo al foco (NO rota sola) -- confirmado con evidencia
  area: [core-ui]
  severity: minor
  screen: HomePage (HeroView)
  steps:
    - Entrar a HomePage, quedarse quieto sin presionar nada 20s, comparar 2 capturas
    - Mover el foco con Right/Left sobre el riel de EN VIVO y observar el hero
  expected:
    - Si es reactivo a foco (como se confirmó), el hero solo cambia cuando el usuario navega, nunca solo
    - Si tuviera autoplay, debería cambiar sin input del usuario -- NO fue el caso
  logs_watch:
    - Sin eventos nuevos de HeroView durante la espera sin input (confirmado: ninguno)
  visual_check: >
    2 capturas separadas por ~20s sin input (deben ser idénticas) + 1
    captura tras mover el foco (debe cambiar sincronizado)

