    - La imagen de fondo del hero puede tardar en cargar tras ráfaga (aceptable), pero debe terminar cargando
  logs_watch:
    - Sin excepciones ni warnings de textura fallida (solo los warnings normales de "texture larger than UI resolution", ya conocidos y no bloqueantes)
  visual_check: captura inmediata post-ráfaga + recaptura 2s después

- id: SC-HOME-VERMAS-01
  status: >
    CONFIRMADO -- corrida formal 2026-09-15, RECONFIRMADO con ambos casos
    verificados de nuevo end-to-end. Caso positivo: "Regional News México"
    (limit:27) -- navegado con Right hasta el item 26 (Zacatecas) + tile
    "Ver más — Regional News México" confirmado visualmente (captura 12),
    Select confirmado por log (`screen_name:"Category"`,
    `showScreencategoryGridPage`) y por captura del grid multi-fila (13,
    todos los estados de México). Caso negativo: "DocuFIA" (limit:15) --
    navegado con Right hasta el item 15 real ("DocuFIA: Una historia
    particular"), SIN ningún tile adicional después (captura 18) -- el
    riel termina exactamente en el total configurado. Patrón sano
    confirmado de nuevo, sin excepciones.
    ---
    DONE (2026-09-15, exploración, a pedido explícito del usuario durante
    la corrida) -- PASÓ. Confirmado el patrón completo: "Ver más" SOLO
    aparece al final de un riel cuando la categoría tiene MÁS contenido
    real del que el riel llega a mostrar navegando hasta el final con
    Right. Casos confirmados:
    - "Regional News México" (config `limit:27`): SÍ tiene "Ver más" al
      final del riel (captura 20). Seleccionarlo navega a
      CategoryGridPage (`screen_name:"Category"`,
      `showScreencategoryGridPage`, capturas 21-22) con grid multi-fila
      mostrando TODOS los estados regionales, confirmado más contenido
      visible que en el riel original de Home.
    - "DocuFIA" (config `limit:15`): NO tiene "Ver más" -- navegando con
      Right hasta el final del riel se llega al último item real (15to,
      "DocuFIA: Una historia particular") sin ningún tile adicional
      después (captura 24). El riel ya muestra el total real disponible,
      por eso no hace falta "ver más".
    - "Series" (1 solo item real) y "Podcast" (9 items): tampoco tienen
      "Ver más" -- mismo patrón, el riel ya cabe el total.
    CONCLUSIÓN DEL PATRÓN: "Ver más" no es inconsistente ni un bug --
    aparece exactamente cuando el riel de Home no alcanza a mostrar todo
    el contenido real de esa categoría, y no aparece cuando sí lo hace.
    No se encontró ningún caso de un riel con claramente más contenido del
    mostrado que NO ofreciera "Ver más" (que sí sería un hallazgo real).
  title: "Tile \"Ver más\" al final de un riel -- solo en categorías con más contenido del que el riel muestra"
  area: [core-ui, core-network]
  severity: minor
  screen: HomePage -> CategoryGridPage
  steps:
    - Sobre un riel con más contenido configurado que el visible (ej. Regional News México), navegar con Right hasta el final
    - Confirmar que aparece el tile "Ver más <Nombre categoría>"
    - Seleccionarlo y confirmar por log y captura que lleva a una pantalla con TODO el contenido de esa categoría
    - Repetir en un riel con pocos items (ej. DocuFIA, Series) y confirmar que NO aparece "Ver más" porque no hace falta
  expected:
    - Ver más aparece únicamente cuando hay contenido real no mostrado en el riel
    - Al seleccionarlo, navega a CategoryGridPage con más contenido que el riel original (nunca pega en el mismo lugar ni rompe nada)
    - Un riel que ya muestra todo su contenido no necesita ni muestra "Ver más"
  logs_watch:
    - 'Al seleccionar "Ver más": `screen_name:"Category"`, `ViewStack : showScreencategoryGridPage`'
  visual_check: >
    captura del tile "Ver más" al final del riel, captura de la
    CategoryGridPage cargada mostrando más contenido que el riel

