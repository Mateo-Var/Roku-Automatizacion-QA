# Escenarios compartidos (Core) — Navegación: Home, Discover, EPG, Search, Favoritos
#
# Ver scenarios/shared/README.md para la convención de `area`/`severity`/`status`.
# Estado (2026-09-15): primera corrida real completada contra el device
# (192.168.1.186), los 5 confirmados PASAN, con UN HALLAZGO nuevo real
# (excepción BrightScript al marcar favorito desde ShowPage, ver
# SC-FAV-01 abajo). Evidencia completa:
# reports/azteca/navegacion/NAVEGACION-20260915-111232/ (25 capturas +
# telnet.log). NOTA: el agente que corrió esto dejó la evidencia cruda
# pero no llegó a documentar el resultado (se cortó por un cambio de
# sesión) -- este resumen fue reconstruido leyendo el telnet.log
# directamente, no es un reporte del agente.

- id: SC-HOME-01
  status: >
    DONE (2026-09-15) -- PASÓ. `HomePage : Init` confirmado, navegación
    fluida entre rieles, sin timeouts ni freezes observados. Capturas
    01-02 (incluye navegación en ráfaga, sin romperse).
  title: Home carga catálogo
  area: [core-network, core-ui]
  severity: blocker
  screen: HomePage
  steps:
    - Entrar a HomePage tras login
    - Navegar entre rieles/categorías con el control remoto
  expected:
    - Rieles cargan contenido, navegación fluida (sin freezes)
  logs_watch:
    - Sin timeouts repetidos en las Tasks de red
  visual_check: screenshot de HomePage completa (baseline)

