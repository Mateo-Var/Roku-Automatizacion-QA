- id: SC-FAV-01
  status: >
    PARCIAL (2026-09-15) -- el flujo funcional PASA (marcar, aparece en
    FavoritePage, quitar -- confirmado en capturas 14, 15, 17, 24), PERO
    se encontró un HALLAZGO real de fondo: al marcar como favorito desde
    ShowPage, el log muestra
    `BRIGHTSCRIPT: ERROR: roSGNode.AddReplace: "compnode": Type mismatch:
    ottnext_ms_sdk_componentlib:/components/pages/ShowPage/ShowPage.brs(1087)`
    -- reproducido 2 VECES en la misma corrida (con 2 shows distintos:
    "DocuFIA: Terror..." y "DocuFIA: Niños santos"), mismo patrón exacto
    ambas veces. Visualmente NO rompe nada (captura 16 muestra la pantalla
    normal, ícono de favorito visible) -- mismo perfil que
    SC-PLAYER-BUG-01: excepción no manejada que no crashea la app, se
    recupera sola. Severidad: minor/major a confirmar -- necesita una 3ra
    corrida para descartar que sea intermitente antes de reportarlo con
    confianza (mismo criterio de rigor que AC-UL-02/AC-SEC-04).
  title: Agregar/quitar favorito
  area: [core-network, core-ui]
  severity: minor
  screen: FavoritePage
  steps:
    - Marcar un contenido como favorito desde detalle
    - Verificar que aparece en FavoritePage
    - Quitarlo
  expected:
    - Persistencia correcta del estado de favorito
  logs_watch:
    - 'NUEVO (2026-09-15): vigilar "roSGNode.AddReplace: compnode: Type mismatch" en ShowPage.brs(1087) al marcar favorito -- ver hallazgo arriba'

