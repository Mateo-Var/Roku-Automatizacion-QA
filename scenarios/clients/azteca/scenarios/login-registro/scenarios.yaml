- id: AC-REG-01
  status: >
    DONE (2026-09-14) -- PASÓ los 3 casos (registro nuevo, email duplicado,
    password débil). Evidencia: reports/azteca/login-registro/AC-REG-01-20260914/.

    RE-CONFIRMADO (2026-09-18, device 192.168.1.54, build v1.24.92609040) --
    PASA. Flujo real: sidebar "Ingresar" -> LoginRegPage -> columna
    IZQUIERDA "Regístrate"/"REGISTRARME CON EMAIL" (amarillo) -> diálogo
    nativo Roku "Vamos a crear tu cuenta" (Continuar) -> RegEmailView
    ("Crear una cuenta", screen_name GA4 "Register with Email"). El email
    venía pre-cargado con la cuenta Roku (ottnext@mediastre.am); se REEMPLAZÓ
    por un email de prueba inventado qa-test-2026-09-18-01@example.com
    (NO se usó la cuenta real) + password válida QaTest2026 (8+ chars, 1
    mayúscula, 1 número -- verificada con toggle MOSTRAR carácter por
    carácter). REGISTRARME -> navega a "VERIFICA TU CUENTA" (screen_name
    "Verify with Code"): el registro se acepta y dispara envío de código de
    activación al email, exigiendo verificación adicional de forma clara,
    sin crash. Caso de error re-confirmado: código inventado "000000"
    rechazado por backend con status:"ERROR" / error:"OTP_CODE_INVALID",
    UI muestra borde rojo + mensaje "El código que ingresaste es incorrecto
    o ha expirado...", permanece en la pantalla sin crash y NO loguea
    (login_status sigue "anonymous"). El caso de email duplicado ya está
    cubierto por AC-UL-02 (EMAIL_ALREADY_REGISTERED). No se completó el
    registro (requiere el código real del email, fuera del alcance del
    agente), por lo que no queda cuenta verificada creada. Evidencia:
    reports/azteca/2026-09-18_11-37-login-registro/{logs/AC-REG-01.log,videos/AC-REG-01.mp4,screenshots/AC-REG-01-01..10-*.jpg}
  title: Registro de cuenta nueva (confirmado que SÍ existe -- "Regístrate"/"Registrarme con email")
  area: [core-network, core-ui]
  severity: major
  screen: LoginRegPage (opción de registro)
  steps:
    - Ir a LoginRegPage
    - Seleccionar "Regístrate" / "Registrarme con email"
    - Completar el flujo con un email de prueba NUEVO (no uno ya registrado) y una contraseña de prueba, usando el teclado en pantalla
    - Confirmar el registro
    - "Caso de error: intentar registrar con el email YA existente (qa.tester@example.com) y confirmar que muestra error de cuenta duplicada, no crash"
    - "Caso de error: intentar registrar con formato inválido (email sin @, contraseña muy corta si aplica) y confirmar mensaje de error"
  expected:
    - El flujo de registro completa o pide verificación adicional (ej. email de confirmación) de forma clara, sin crash
    - Registro con email duplicado muestra error claro, no crea cuenta duplicada ni loguea con datos ajenos
    - Formato inválido muestra error específico, no crash
  logs_watch:
    - Sin excepciones no manejadas durante el flujo de registro
    - Error de dominio manejado (isSuccess=false) en los casos de error, no excepción cruda
  visual_check: >
    Igual que AC-UL-02: usar el toggle "MOSTRAR" si existe en el campo de
    contraseña para confirmar con certeza qué quedó tipeado antes de
    confirmar cada intento.

- id: AC-SEC-LOGIN-EDGE-01
  status: >
    DONE (2026-09-14) -- Escenario consolidado, reemplaza a los antiguos
    AC-UL-KEYBOARD-01 (merged), AC-SEC-01 (superseded), AC-SEC-01B,
    AC-SEC-02, AC-SEC-05, AC-SEC-06 y AC-SEC-07 -- eran 5-7 IDs separados
    para variaciones del MISMO campo password/email en la MISMA pantalla,
    que además siempre se corrían juntos en una sola sesión (ver
    scenarios/shared/login-registro/runbook.md Fase 2). Se fusionan acá sin
    perder cobertura -- cada sub-caso abajo mapea 1:1 a un hallazgo ya
    confirmado. TODOS los sub-casos A-E: DONE, no re-ejecutar salvo
    sospecha de regresión puntual. Evidencia repartida entre
    reports/azteca/login-registro/AC-SEC-01B-20260914-135206/,
    AC-UL-02-20260914-run2/, LOGIN-REGISTRO-FULL-v2-20260914-1434/.

    RE-CONFIRMADO (2026-09-18, device 192.168.1.54, build v1.24.92609040) --
    sub-caso A (fuerza bruta / rate limiting), el hallazgo insignia,
    re-confirmado por la ruta de login real (LoginRegPage -> INGRESAR CON
    EMAIL -> diálogo nativo "Iniciar sesión" -> "Usar un correo electrónico
    diferente" -> LoginEmailView con email INEXISTENTE
    noexiste.qa2026b@example.com -> INGRESAR CON CONTRASEÑA ->
    LoginWithPasswordView). Se hicieron 3 intentos consecutivos de login
    con password (password verificada con MOSTRAR "Passw0rd1"): los 3
    rechazados con HTTP 400 {"status":"ERROR","error":"FEDERATION_INVALID_CREDENTIALS"}
    (6 respuestas del backend registradas, 4 eventos GA4 login_error,
    login_source:"email", IM vacío), SIN ninguna fricción: cero
    ocurrencias de HTTP 429 / "too many" / retry-after / captcha / throttle
    / rate-limit / blocked en todo el log. Confirma que NO hay rate
    limiting real ante intentos repetidos. Sub-casos B-E no re-ejecutados
    esta corrida (siguen DONE de 2026-09-14, sin sospecha de regresión).
    Evidencia: reports/azteca/2026-09-18_11-37-login-registro/{logs/AC-SEC-LOGIN-EDGE-01.log,videos/AC-SEC-LOGIN-EDGE-01.mp4,screenshots/AC-SEC-EDGE-01-01..08-*.jpg}
  title: "Robustez del formulario de login: fuerza bruta, validación, inyección, input largo, normalización de email (consolidado)"
  area: [core-network, core-ui]
  severity: major
  screen: LoginEmailView / LoginWithPasswordView
  steps:
    - "Sub-caso A (fuerza bruta, aislada del bug): con un email INEXISTENTE, 3 intentos consecutivos de login con password cualquiera -- editar solo el último caracter entre intento e intento (roku-type.js), verificar por log. DONE: rechaza los 3, pero SIN ninguna fricción (sin HTTP 429/delay/captcha) -- hallazgo confirmado: no hay rate limiting real."
    - "Sub-caso B (password vacía/mínima, con email VÁLIDO): probar password vacía, luego 1 caracter. DONE: ambos rechazados correctamente, nunca loguea."
    - "Sub-caso C (inyección, en AMBOS campos, con email VÁLIDO donde aplique): entrada tipo comillas simples/dobles mezcladas. DONE: sin crash, sin excepción BrightScript en ningún campo -- la app trata el string como texto plano. NOTA: si se prueba como password contra el email válido, va a disparar el bug crítico ya conocido (AC-UL-02 Caso B) -- eso es esperado, no reconfirmar con cuidado extra."
    - "Sub-caso D (input largo 50+ chars, en AMBOS campos): DONE: trunca/hace scroll prolijo en los dos campos, sin crash ni freeze."
    - "Sub-caso E (case sensitivity y espacios en email, con password correcta): mayúsculas + espacio final. DONE: mayúsculas rechazadas (case-sensitive, comportamiento válido no-bug), espacio final se trimea bien y loguea normal."
  expected:
    - Ningún sub-caso debe crashear la app ni generar excepción BrightScript no manejada
    - Sub-caso A: idealmente debería haber fricción ante intentos repetidos (NO la hay -- hallazgo)
    - Sub-casos B/C/D/E: comportamiento robusto confirmado, sin hallazgos nuevos más allá de lo ya documentado
  logs_watch:
    - Sin excepciones BrightScript no manejadas en ningún sub-caso
    - Sub-caso A -- buscar "rate limit"/HTTP 429 (no apareció)
    - Sub-caso B -- CRÍTICO si login_success con password vacía/1 char (no ocurrió)
  visual_check: >
    Presupuesto acotado -- 1 captura para el sub-caso A (resultado final),
    1 para B, 1 con MOSTRAR si C se prueba como password, 1 para D
    (campo largo), 1 para E. El resto se confirma por log
