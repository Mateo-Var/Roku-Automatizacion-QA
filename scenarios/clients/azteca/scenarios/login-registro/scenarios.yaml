# Escenarios compartidos (Core) — Login, Registro y Seguridad del formulario
#
# Ver scenarios/shared/README.md para la convención de `area`/`severity`/`status`.
# Ver scenarios/shared/login-registro/runbook.md para el guión operativo
# de cómo correr toda esta batería en una sola sesión (~18-20 min).
#
# Estado (2026-09-15): los 8 escenarios están validados contra Azteca
# (device 192.168.1.186), con 3 hallazgos reales confirmados y pendientes
# de reportar al equipo de Core/backend -- ver PROJECT_MEMORY.md, sección
# "📍 Resumen ejecutivo" al principio del archivo, para el detalle.
#
# NOTA MULTI-CLIENTE: estos escenarios prueban componentes del Core
# (LoginRegPage, LoginEmailView, etc.), compartidos por todos los
# clientes -- no deberían necesitar reescribirse para correr contra otro
# cliente, solo credenciales/device distintos (ver
# scenarios/clients/<cliente>/profile.yaml). Sin confirmar todavía si el
# bug crítico es del Core (afectaría a todos) o de la config/backend
# específico de Azteca -- pendiente probar en un segundo cliente.

- id: AC-UL-01
  status: >
    DONE (2026-09-18, re-corrida completa) -- device 192.168.1.54, build "TV
    Azteca En Vivo" v1.24.92609040. Se logueó desde AccountPage ("Cerrar
    sesión") para forzar estado deslogueado real: log confirma
    "login_status":"anonymous" (IM vacío). Cold start (Home + launch/dev)
    en ese estado -> GA4 screen_view arranca con "login_status":"anonymous",
    confirmando la precondición "sin sesión iniciada". NOTA sobre el
    "prompt de login": la app NO fuerza un popup modal al arrancar
    deslogueada -- deja navegar libre con el sidebar mostrando "Ingresar" en
    vez de "Mi cuenta" (ya documentado como comportamiento esperado, ver
    AC-UL-04). El flujo de login real: sidebar "Ingresar" -> LoginRegPage ->
    "Ingresar con email" (intercepta diálogo nativo Roku one-touch ->
    "Usar un correo electrónico diferente") -> LoginEmailView, que ahora
    ofrece explícitamente dos botones "ENVIAR CÓDIGO" / "INGRESAR CON
    CONTRASEÑA" (antes solo se documentaba el flujo de código) -> se usó
    "INGRESAR CON CONTRASEÑA" -> LoginWithPasswordView, email
    qa.tester@example.com + password Ex4mpleP4ss! (verificado char por
    char con MOSTRAR) -> Select -> login_success real confirmado por log,
    mismo IM histórico 30f41b94-1310-46e1-8627-fb31590ffef3,
    login_status:"connected", Home pasa a mostrar "Continuar viendo" y
    sidebar con ícono de cuenta. Identidad visible confirmada en captura
    (Home logueado). Logout re-confirmado también al principio de esta
    corrida desde AccountPage ("Mi cuenta" -> qa.tester@example.com /
    Mateo Vargas -> "Cerrar sesión") -> login_status pasa a "anonymous".
    Los 6 pasos del escenario (cold start deslogueado, prompt/estado de
    login, login exitoso, identidad visible, logout desde AccountPage,
    estado deslogueado tras logout) quedan cubiertos en esta sola corrida.
    Evidencia: reports/azteca/2026-09-18_11-37-login-registro/{logs/AC-UL-01-retry.log,videos/AC-UL-01-retry.mp4,screenshots/AC-UL-01-retry-*.jpg}
    (evidencia del intento parcial anterior sigue en
    logs/AC-UL-01.log,videos/AC-UL-01.mp4).
  title: Login y logout funcionan correctamente (app y Smart Hub)
  area: [core-network, core-ui]
  severity: blocker
  screen: LoginRegPage / AccountPage
  steps:
    - Lanzar el canal desde cero (cold start), sin sesión iniciada
    - Observar que aparece un popup/pantalla pidiendo iniciar sesión
    - Iniciar sesión con credenciales válidas
    - Verificar que se muestra el id de cuenta / apodo con estado "sesión iniciada"
    - Ir a AccountPage y cerrar sesión
    - Verificar que se muestra el estado "sesión cerrada"
  expected:
    - Al arrancar sin sesión, aparece el prompt de login (no deja navegar libre sin avisar)
    - Tras login exitoso, se ve el identificador de cuenta/apodo en algún lugar de la UI
    - Tras logout, vuelve a estado deslogueado visible
  logs_watch:
    - Llamada de auth resuelve isSuccess/ok=true al loguear
    - Limpieza de roRegistry (prefijo ottName) al desloguear
  visual_check: screenshot del popup de login, de la pantalla con sesión iniciada (nombre/apodo visible), y de la pantalla tras logout

- id: AC-UL-02
  status: >
    DONE (2026-09-14) -- Caso A (email inexistente) y Caso C (formato
    inválido) PASARON. Caso B (password incorrecta contra email válido) es
    el BUG CRÍTICO -- ya reproducido 8 VECES en total entre esta y otras
    corridas (AC-SEC-01, AC-SEC-05, AC-SEC-07). NO buscar más
    reproducciones del Caso B -- está sobrado de evidencia, cualquier
    nuevo intento de login con email válido + password incorrecta lo va a
    disparar de nuevo como efecto secundario, eso es esperado y no hace
    falta documentarlo de nuevo cada vez. Evidencia:
    reports/azteca/login-registro/AC-UL-02-20260914-090500_AMBIGUO-reintentar/
    (primera corrida, ambigua) y AC-UL-02-20260914-run2/ (confirmación
    definitiva con MOSTRAR).

    RE-CONFIRMACIÓN 2026-09-18 (post-reorganización, device 192.168.1.54 --
    mismo Roku Express, antes .186): Caso B NO se reprodujo esta vez, con
    un resultado distinto y significativo. El flujo real de "Ingresar con
    email" en este build lleva al MISMO formulario compartido que
    "Registrarme con email" (`RegEmailView`, GA4 marca
    `screen_name:"Register with Email"` para ambos). Al enviar
    qa.tester@example.com + password incorrecta, el backend
    respondió `HTTP 400 {"status":"ERROR","error":"EMAIL_ALREADY_REGISTERED"}`
    -- es decir, la app rechazó el intento PORQUE el email ya existe,
    sin llegar a validar la contraseña en ningún momento (evento GA4
    resultante: `login_error`, NO `login_success`). Esto es DISTINTO del
    bug original (que sí lograba `login_success` con password
    incorrecta) -- posible indicio de que el flujo de login cambió (ya no
    intenta autenticar con password contra una cuenta existente por esta
    ruta) o que el fix ya se aplicó del lado del backend. PENDIENTE:
    confirmar si existe una ruta de login "real" separada (ej. un botón
    "INGRESAR CON CONTRASEÑA" reportado en otra sesión) que si valide
    password contra cuenta existente -- en esta corrida no apareció esa
    opción, solo el diálogo nativo Roku (Continuar/Cancelar/Política)
    seguido siempre del mismo formulario de registro compartido. NO dar
    el bug original por resuelto sin esa confirmación adicional -- puede
    que exista otra ruta de login que sí sea vulnerable y no se haya
    ejercitado hoy. Evidencia: reports/azteca/2026-09-18_11-37-login-registro/
    (logs/AC-UL-02.log, videos/AC-UL-02.mp4, screenshots/AC-UL-02-*.jpg).

    ⚠️ RE-CORRIDA DEFINITIVA 2026-09-18 17:15-17:22 UTC (AC-UL-02-retry,
    device 192.168.1.54, build v1.24.92609040) -- LA RE-CONFIRMACIÓN
    ANTERIOR ESTABA CONTAMINADA: se había ejercitado el flujo de REGISTRO
    (RegEmailView / screen_name "Register with Email"), NO el de login. La
    ruta de LOGIN REAL existe y es otra, confirmada por log paso a paso:
    sidebar "Ingresar" -> `LoginRegPage : Init` (screen_name "Login") ->
    botón "INGRESAR CON EMAIL" (columna derecha "Inicia sesión", NO el
    amarillo "REGISTRARME CON EMAIL" de la izquierda) -> diálogo NATIVO de
    Roku titulado "Iniciar sesión" (one-touch con ottnext@mediastre.am) ->
    "Usar un correo electrónico diferente" -> `LoginEmailView : Init`
    (screen_name "Login with Email") -> botón "INGRESAR CON CONTRASEÑA" ->
    `LoginWithPasswordView : Init` (screen_name "Login with Password").

    Resultados por esa ruta real:
    - Caso A (email inexistente noexiste.qa2026@example.com + password
      cualquiera): PASA. Backend responde HTTP 400
      {"status":"ERROR","error":"FEDERATION_INVALID_CREDENTIALS"}, GA4
      emite `login_error` con IM vacío, la UI muestra el mensaje genérico
      correcto "El usuario o contraseña son incorrectos" y permanece en
      LoginWithPasswordView sin crash.
    - Caso B (email VÁLIDO qa.tester@example.com + password
      DELIBERADAMENTE INCORRECTA "WrongPass2026!", verificada
      carácter por carácter con el toggle MOSTRAR antes de confirmar):
      **BUG CRÍTICO REPRODUCIDO, NO ESTÁ ARREGLADO**. GA4 emite
      `login_success` con login_source:"email", new_user:false,
      login_status:"connected" e IM real
      30f41b94-1310-46e1-8627-fb31590ffef3 (el MISMO del login legítimo de
      AC-UL-01). La app navega a HomePage ya logueada, con fila
      "Continuar viendo" e ícono de cuenta en el sidebar, y AccountPage
      muestra la identidad real completa ("qa.tester@example.com /
      Mateo Vargas" + "Cerrar sesión"). Es decir: sesión plena y legítima
      obtenida con una contraseña incorrecta. 9na reproducción del bug, y
      la PRIMERA por la ruta de login real post-reorganización -- queda
      descartada la hipótesis de que el backend lo hubiera arreglado.
      Contraste demoledor con el Caso A: el MISMO endpoint sí valida
      credenciales cuando el email no existe (FEDERATION_INVALID_CREDENTIALS)
      pero NO valida la password cuando el email sí existe.
      Nota lateral: en el login exitoso aparece también
      `ssoService : saveData : Response : {status:404, response:"Service
      error: Make sure that you have set a billing channel"}` -- error
      manejado, no crashea, pero vale reportarlo aparte.
    - Caso C (formato inválido "correosinarroba.com"): PASA. Validación
      client-side en LoginEmailView, mensaje "Formato de correo inválido"
      en rojo bajo el campo, sin llamada de red y sin crash.
    Evidencia: reports/azteca/2026-09-18_11-37-login-registro/
    (logs/AC-UL-02-retry.log, logs/AC-UL-02-retry-casoB.log,
    videos/AC-UL-02-retry.mp4, screenshots/AC-UL-02-retry-01..18-*.jpg).
  title: Manejo de credenciales inválidas / formato incorrecto
  area: [core-network, core-ui]
  severity: major
  screen: LoginRegPage
  steps:
    - Ir a LoginRegPage (deslogueado)
    - "Caso A -- email incorrecto: ingresar un email que NO existe como cuenta (ej. variante inventada), contraseña cualquiera, confirmar"
    - "Caso B -- password incorrecta: ingresar el email VÁLIDO (qa.tester@example.com) con una contraseña deliberadamente incorrecta, confirmar"
    - "Caso C -- formato inválido: email sin @, o campo vacío, confirmar"
  expected:
    - Solo cuentas autorizadas pueden loguear -- en NINGÚN caso (A, B o C) debe terminar logueado
    - Mensaje de error visible y específico por cada caso
    - No crash, permanece en LoginRegPage
  logs_watch:
    - Error de dominio manejado (isSuccess=false / error() controlado), no excepción cruda ni ParseJSON sin manejar
    - 'CRÍTICO: NUNCA debe aparecer "login_success"/"login_status":"connected" en los casos A o B -- si aparece, es el bug a confirmar'
  visual_check: >
    screenshot de cada mensaje de error mostrado. OBLIGATORIO antes de
    confirmar cada intento: activar el toggle "MOSTRAR" (mostrar
    contraseña) visible en la pantalla de password y tomar captura del
    texto en claro, para confirmar con certeza qué carácter por carácter
    quedó realmente escrito por el teclado en pantalla -- esto es lo que
    faltó la vez pasada y dejó un resultado ambiguo (ver PROJECT_MEMORY.md,
    sesión 2026-09-14). No confirmar el intento sin haber verificado así el
    valor real tipeado.

