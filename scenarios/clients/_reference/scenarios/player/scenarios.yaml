# --- Continue Watching / actualización al hacer Back (origen: PR-174) ---
#
# Origen: validación del PR https://github.com/mediastream/ott-next-core-roku-tv/pull/174
# ("[Bug][Roku] Al hacer back en la reproducción no se actualiza el Continue
# Watching automáticamente"). El ticket original traía 15 casos QA-01..QA-15
# (ver reports/azteca/continue-watching-pr174/ para la corrida completa con
# esa granularidad). Acá quedaron reducidos a los 5 casos que representan
# comportamientos realmente distintos; el resto eran la misma validación
# repetida en pantallas distintas (grilla de categoría, Discover, ficha del
# show vs lista de episodios, etc.) -- NO ameritan un escenario aparte salvo
# que se sospeche una regresión puntual de esa pantalla específica.
#
# REGLA CRÍTICA DE METODOLOGÍA (causó 2 falsos negativos en la validación
# original, NO REPETIR EL ERROR): antes de reproducir cualquier contenido
# para estos casos, confirmar su DURACIÓN TOTAL (la ficha del show o la
# tarjeta del episodio suelen mostrar un badge, ej. "3 MINUTOS", "1H 29M").
# Si el contenido es corto y el tiempo que se lo deja reproducir antes del
# Back es una fracción grande de esa duración total, el contenido puede
# llegar a completarse durante la prueba -- ahí es ESPERADO que no aparezca
# en Continuar Viendo (un contenido terminado no debe aparecer ahí), y eso
# NO es el bug, es un falso negativo del método. Para SC-CW-01/02/03/05 usar
# contenido de varios minutos+ y dejarlo correr solo unos segundos (una
# fracción chica de su duración total) antes del Back. Para SC-CW-04 es al
# revés: ahí el objetivo ES llegar al final real, por eso conviene un
# contenido corto (2-4 min) para no tardar mucho en la prueba.
#
# Metodología general: log-first (telnet, puerto 8085) -- confirmar
# VODStartComplete/status "playing" antes de contar tiempo de reproducción,
# y el estado de Continuar Viendo se valida por captura de pantalla del Home
# (la barra de progreso es UI, no aparece en el log). Si se toman dos
# capturas para comparar "antes/después", verificar que no sean el mismo
# archivo (comparar MD5) antes de confiar en la comparación -- el endpoint
# de captura puede devolver una imagen cacheada.

