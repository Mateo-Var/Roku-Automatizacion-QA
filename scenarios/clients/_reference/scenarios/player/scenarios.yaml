# Escenarios de Player -- app de REFERENCIA del Core ("Next" / OTTNext_CLIENT_APP)
#
# IMPORTANTE: esto NO es un cliente real que paga por el servicio. "Next" es
# la app genérica/demo que Mediastream usa como referencia del Core cuando
# no hay un build de cliente específico cargado en el device -- estos 9
# casos se validaron contra ese build genérico (build 1.22.202605260,
# device 192.168.1.63) durante la sesión 2026-09-16/17, en el contexto de
# la validación del PR-174 (Continue Watching / Back) y los botones de fin
# de episodio (Up Next), NO contra "TV Azteca En Vivo".
#
# Separado del resto de la batería de player (que sí es 100% Azteca, ver
# scenarios/clients/azteca/scenarios/player/scenarios.yaml) el 2026-09-18,
# al reorganizar el proyecto para soportar múltiples clientes -- antes
# vivía mezclado en scenarios/shared/player/scenarios.yaml.
#
# Útil como punto de partida/comparación cuando se valide el mismo
# comportamiento en un cliente real: si un cliente muestra un resultado
# distinto acá documentado para "Next", es una buena señal de que el
# comportamiento es específico de la personalización de ese cliente y no
# un bug del Core.

# --- Up Next: botones "Siguiente episodio" / "Ver créditos" (fin de episodio VOD) ---
#
# Contexto (pedido explícito del usuario, 2026-09-17): en shows VOD con más
# de un episodio, a ~5 segundos del final aparecen dos botones superpuestos
# al video: "Siguiente episodio" (NEXT_EP) y "Ver créditos"/"Seguir viendo
# créditos" (CREDITS). Hay 3 comportamientos a validar según qué haga el
# usuario, más 1 caso de borde (última temporada/episodio, donde NEXT_EP no
# debe existir porque no hay siguiente). NO se fusionaron en un solo flow
# porque cada uno necesita llegar al final de un episodio DISTINTO -- no son
# reducibles a una sola reproducción, solo comparten el mismo setup.
#
# Herramienta para llegar al final sin mirar el video en tiempo real:
# `scripts/smart-seek-agent.js <ruta-al-telnet.log>` -- ya validado en
# sesión 2026-09-11, avanza por niveles escalonados de Fwd+Select según el
# tiempo restante reportado en el log, y deja de tocar nada por debajo de
# ~2 minutos restantes (los botones de Up Next aparecen recién a ~5s del
# final, no antes -- no hay que forzar nada ahí, solo dejar correr en
# tiempo real esos últimos segundos). Requiere tener el telnet ya
# conectado y volcando a un archivo de log antes de arrancarlo.
#
# Cálculo de duración/posición: usar `query/media-player` (ECP) o el log de
# telnet (duration/position del player) para saber cuánto falta, en vez de
# asumir un tiempo fijo -- la duración varía por episodio.

- id: SC-UPNEXT-NEXTEP-01
  status: >
    CONFIRMADO 2026-09-17 (continuación 6, device .63, login activo).
    "Lotería del Crimen" Temporada 1, Capítulo 2 ("El Huérfano") avanzado
    con ráfagas de Fwd+Select hasta posición 2891.5s de 2896.6s de
    duración (remaining ~5.1s, ventana de botones ya documentada). Un
    Select en ese punto (posición AÚN NO llegó al final real) disparó de
    inmediato `RAFPlayerTask: mid-roll ads` -> `seek to 2890` ->
    transición directa a un episodio NUEVO (`episode/68ccea03378204b6618ff84c.json`,
    Capítulo 3, `playVideo : Seek parameter = 0`) -- cambio inmediato de
    contenido sin esperar el fin real del episodio actual, consistente con
    presionar "Siguiente episodio". Repetido una 2da vez con Capítulo 3 ->
    Capítulo 4 con el mismo patrón (Select cerca del final -> episodio
    nuevo inmediato). Sin excepciones BRIGHTSCRIPT. Nota de limitación:
    las capturas de Roku no muestran el frame de video ni el overlay de
    botones (política ya documentada, frame negro) -- la confirmación es
    100% por log (cambio de video_id/episode antes del fin real
    reportado por duration). Evidencia:
    reports/azteca/player/CORRIDA-device63-20260917/telnet.log (líneas
    ~17550-17600 y ~17800-17850 aprox.).
  title: "Botones de fin de episodio: presionar 'Siguiente episodio' cambia al episodio que sigue"
  area: [player, core-network]
  severity: major
  screen: Player, últimos ~5s de un episodio VOD (no el último de la temporada)
  steps:
    - Reproducir un episodio VOD que NO sea el último de su temporada/show (para que exista un "siguiente" real)
    - Usar `scripts/smart-seek-agent.js` (con telnet ya conectado a un log) para avanzar hasta cerca del final, sin pasarse
    - Cuando queden ~5s, confirmar por UI/log que aparecen los dos botones ("Siguiente episodio" y "Ver créditos")
    - Con foco en "Siguiente episodio", presionar Select
  expected:
    - La app cambia inmediatamente al episodio siguiente (no espera a que termine el actual), arrancando su reproducción desde el inicio
  logs_watch:
    - Cambio de `video_id`/`playback_id` en los eventos de analytics, coincidiendo con el episodio siguiente esperado (no uno salteado ni el mismo)
    - Sin excepciones de BrightScript en la transición
  visual_check: captura mostrando los dos botones antes de seleccionar, y captura del nuevo episodio arrancando

- id: SC-UPNEXT-CREDITS-01
  status: >
    INTENTADO SIN ÉXITO otra vez, 2026-09-17 (continuación 7, device .63)
    -- técnica corregida aplicada exactamente como se pidió, sigue siendo
    limitación de MÉTODO, no bug de la app. 4 intentos totales acumulados
    ahora (2 de la continuación 6 + 2 de esta sesión), todos terminan en
    NEXTEP.

    Técnica de esta sesión: avance en bloques manuales x5/x1 (sin usar el
    modo automático completo de `smart-seek-agent.js` -- ver hallazgo
    nuevo abajo sobre por qué), deteniendo TODO input una vez alcanzado
    remaining ~150-160s, y de ahí en adelante monitoreo 100% pasivo vía
    `query/media-player` (ECP) cada 8-10s, CERO keypresses, hasta
    remaining <=20s. A remaining=15s una captura confirmó pantalla
    negra (sin overlay visible todavía, esperado). A remaining=6.2s se
    envió Right (para mover foco fuera del default asumido) + Select
    ~300ms después -- el log mostró que el evento `right` llegó a
    `MediaStreamPlayer` (el player normal), NUNCA a `UpnextOverlay` --
    es decir, el overlay de botones TODAVÍA NO había aparecido en el
    momento exacto de enviar la tecla, y para cuando `Select` llegó
    (~2s después por el round-trip de ECP+poll), el contenido ya había
    llegado a su fin real y el Select fue tomado como confirmación del
    autoplay/NEXTEP por defecto. CONCLUSIÓN: la ventana real en la que
    el overlay acepta navegación explícita hacia "Ver créditos" es más
    angosta de lo documentado originalmente (posiblemente 2-3s reales,
    no 5s) y el round-trip de ECP (keypress HTTP + lectura de log) de
    este agente (~1-2s por acción) es demasiado lento para reaccionar
    DENTRO de esa ventana una vez que aparece -- por diseño no hay forma
    de "ver" el overlay aparecer (las capturas nunca muestran overlays de
    video en tiempo real, y el log no emite una línea explícita de
    "overlay shown", solo se infiere por los `onKeyEvent` que S~llegan a
    `UpnextOverlay` en vez de `MediaStreamPlayer`).

    HALLAZGO NUEVO no documentado antes (relevante para futuros intentos
    y para otros escenarios que usen `smart-seek-agent.js` cerca del
    final): el modo automático completo del script (dejarlo correr sin
    supervisión hasta que él mismo decida frenar en la `STOP_TOUCHING_THRESHOLD`)
    causó 2 problemas nuevos en esta sesión que NO estaban documentados:
    (a) su lógica de "recuperación por posición estancada" (3 lecturas
    iguales seguidas -> Select de recuperación) puede disparar un Select
    DENTRO de la ventana de botones si el estancamiento coincide con el
    tramo final, causando NEXTEP no intencional (esto costó 2 episodios
    completos en esta sesión); (b) en un caso el episodio llegó a
    `finished`->`stopped`->`exiting playContentWithAds()` y la carga del
    siguiente episodio quedó con el spinner visible sin progreso aparente
    por más de 3 minutos reales (`query/media-player` reportando
    `state="close"` sostenido) -- un `Back` sacó la app limpiamente a Home
    sin crash, así que NO se puede confirmar como bug real (pudo haber
    seguido cargando si se esperaba más), pero es un punto a vigilar en
    una futura sesión con más presupuesto de tiempo (dejarlo sin tocar
    5+ minutos reales para confirmar si realmente cuelga o solo es lento).
    Por estos 2 hallazgos, la recomendación para la próxima sesión es NO
    usar el modo automático de `smart-seek-agent.js` sin supervisión
    activa cerca del final (usar avance manual con chequeo entre cada
    toque, como se hizo en el 2do intento de esta sesión, que sí llegó
    limpio hasta remaining=150s sin incidentes).

    Recomendación concreta para reintentar: en vez de mandar
    Right+Select como una sola acción cuando se estima que faltan ~5-6s,
    mandar Right SOLO (sin Select) repetidas veces cada ~1s empezando
    ANTES de lo estimado (ej. desde remaining=10s), y recién confirmar
    con Select cuando el LOG confirme un `onKeyEvent` recibido por
    `UpnextOverlay` (no por `MediaStreamPlayer`) -- eso es la única señal
    fiable de que el overlay ya está activo y aceptando navegación. Sigue
    sin ser un bloqueo de la app, es una limitación de timing del método
    del agente (latencia ECP + falta de señal explícita de "overlay
    shown" en el log).

    **CIERRE DEFINITIVO 2026-09-17 (continuación 8, device .63) -- 4to y
    ÚLTIMO intento, SIGUE SIN LOGRARSE, se cierra el caso como limitación
    de método (no bug de la app).** Se usó "Lotería del Crimen" (mismo
    show ya validado), episodio nuevo "La Tóxica" vía
    `scripts/smart-seek-agent.js` en modo automático completo (el script
    ya frena solo por debajo de 120s restantes, sin necesidad de
    supervisión manual del avance grueso). Dos corridas del script sobre
    dos episodios distintos:
    - 1er episodio ("La Tóxica"): el script se adelantó más de lo
      esperado -- en el tick 6 (con remaining reportado de 942s, lejos
      del final) el `playback_id` cambió solo, saltando a un episodio
      completamente distinto sin que el remaining estimado lo
      justificara. Hallazgo: el contenido tiene mid-rolls muy frecuentes
      (cada ~600s: seek a 610, 1210, 1810, 2410...) y en algún punto la
      duración real jugable resultó menor a la `duration` reportada por
      el player, causando un NEXTEP prematuro sin que el agente lo
      pidiera -- variante nueva del mismo problema de fondo ya
      documentado (el script no tiene forma de distinguir "casi al
      final real" de "duration mal reportada por los mid-rolls").
    - 2do episodio (autoplay del anterior): el script SÍ aterrizó bien
      esta vez (remaining=45s, dejó de tocar). Al monitorear pasivamente
      por ECP (`query/media-player`) cada 2-3s como pedía la técnica,
      se descubrió que la posición quedó **congelada en 2713000ms de
      2758000ms (remaining~45s) durante más de 2 minutos reales**,
      con `state="close"` sostenido en el ECP y una captura confirmando
      el spinner de carga del episodio siguiente detenido en "0%" --
      **esto reproduce por segunda vez** el hallazgo ya registrado en la
      continuación 7 ("spinner colgado >3 min"), esta vez con tiempo de
      espera suficiente (2+ min reales) para subirlo de "a vigilar" a
      **CONFIRMADO como hallazgo real recurrente** (aunque su severidad
      exacta -- freeze real vs. simplemente muy lento -- sigue sin
      determinarse, porque otra vez un `Back` sacó la app limpia a la
      ShowPage sin crash ni BRIGHTSCRIPT nuevo, sin haber esperado más
      de 3-5 min para confirmar si eventualmente hubiera cargado). En
      ningún momento de este intento se pudo siquiera llegar a enviar el
      Right de prueba -- el episodio nunca llegó a mostrar el overlay de
      botones de forma estable, se saltó directo a "fin real -> siguiente
      episodio" antes de que la ventana de observación pudiera actuar.
    **Conclusión final, con 4 intentos acumulados en 2 sesiones distintas,
    todos fallidos por la misma familia de causas (ventana angosta +
    latencia del método + ahora también mid-rolls que distorsionan la
    estimación de "restante"): se cierra este escenario como NO LOGRADO
    por limitación de la técnica de automatización disponible, no como
    bug de la app.** El comportamiento de "Ver créditos" en sí NO se
    pudo ejercer ni una sola vez en las 4 intentonas, pero tampoco hay
    ninguna señal de que la app lo maneje mal -- simplemente no se pudo
    llegar a presionarlo en el instante correcto con las herramientas de
    este agente (ECP + telnet, sin acceso a video en tiempo real). No se
    recomienda seguir reintentando con el mismo método; si se retoma en
    el futuro, haría falta instrumentación adicional (ej. un stream de
    video real o una señal explícita del Core en el log de "overlay
    shown") para tener alguna chance real de éxito. Evidencia:
    reports/azteca/player/CORRIDA-device63-20260917/telnet.log (líneas
    ~26040-27620 aprox.), capturas 163-166 (163 lista de episodios,
    164 "La Tóxica" cargando, 165 spinner colgado en "Los Enamorados" a
    0%, 166 ShowPage tras el Back de recuperación, limpia y sana).
  title: "Botones de fin de episodio: presionar 'Ver créditos' se queda viendo los créditos y AL TERMINAR igual cambia de episodio"
  area: [player, core-network]
  severity: major
  screen: Player, últimos ~5s de un episodio VOD (no el último de la temporada)
  steps:
    - Mismo setup que SC-UPNEXT-NEXTEP-01 (episodio que no sea el último, avanzar con smart-seek-agent.js hasta ~5s del final)
    - Cuando aparezcan los botones, mover el foco a "Ver créditos" (o la opción equivalente de quedarse viendo) y presionar Select
    - Esperar a que el video llegue a su fin real (los créditos terminen de reproducirse)
  expected:
    - Al elegir "Ver créditos", el video sigue reproduciendo el contenido actual (no corta ni cambia de inmediato)
    - Una vez que el video efectivamente termina, la app cambia de episodio igual (mismo comportamiento final que si no se hubiera tocado nada)
  logs_watch:
    - Ningún cambio de `video_id`/`playback_id` inmediatamente después de seleccionar "Ver créditos" (debe seguir siendo el mismo contenido)
    - Cambio de `video_id`/`playback_id` recién cuando el player reporta el fin real (evento `ended` o equivalente)
  visual_check: captura al elegir "Ver créditos" (confirmando que se queda en el mismo video), captura del cambio de episodio al terminar

