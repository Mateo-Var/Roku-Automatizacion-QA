    (confirmado por captura, badge de tiempo consistente con muy poco
    avanzado) sin necesidad de relanzar la app. Nota: esta corrida generó
    ADEMÁS evidencia incidental fuerte de que Continuar Viendo sí
    funciona para VOD entrado por hero: episodios de "Lotería del Crimen"
    (Capítulos 1-6, jugados/avanzados durante los escenarios SC-UPNEXT-*
    de esta misma sesión) y "Lo Que La Gente Cuenta" aparecieron todos en
    la fila con badges de tiempo restante distintos entre sí, sin
    duplicados ni entradas rotas. CONFIRMADO. Evidencia: telnet.log
    líneas ~18600-18700 aprox., capturas 110, 118, 122, 123.
  title: "Reproducir un contenido dentro de un show, volver con Back al Home, validar que aparece en Continuar Viendo con progreso real"
  area: [player, core-network]
  severity: major
  screen: ShowPage -> Player -> Home
  steps:
    - Elegir un contenido (película o episodio) de duración confirmada de varios minutos u horas -- NO usar contenido corto/de prueba sin verificar antes su duración total
    - Entrar a la ficha del show y reproducirlo (o desde un carrusel del Home)
    - "Confirmar por log que arrancó realmente (`VODStartComplete` / `status: \"playing\"`)"
    - Dejarlo correr solo unos segundos (una fracción chica de la duración total del contenido, ver nota de metodología arriba)
    - Presionar Back
    - Volver al Home (relanzar el canal si hace falta) y esperar hasta 5 segundos
  expected:
