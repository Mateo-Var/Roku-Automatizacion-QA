- id: SC-CW-03
  status: >
    REFORZADO 2026-09-17 (continuación 7, device .63, login activo) --
    reincide el `known_issue` ya documentado, consistente con la corrida
    original. Contenido usado: "Lo Que La Gente Cuenta | Anteojos."
    (video_id 68622b5f7a20260e9b374384, duración confirmada 00:40:06).
    Camino de entrada confirmado por log: desde Buscar, tipeando "Venga La
    Alegria" (con typo intencional para variar), se seleccionó el tile de
    episodio individual "Lo Que La Gente Cuenta | Anteojos." de los
    resultados -- el log saltó DIRECTO de `screen_view screen_name:"Search"`
    a `screen_view screen_name:"Player"` SIN ningún `screen_name:"Show"`
    intermedio, confirmando que este tipo de resultado de búsqueda
    (episodio individual, no la tarjeta del programa) abre el Player
    directo. Reproducido ~17s reales (`VODStartComplete` confirmado,
    fracción mínima de los 40 min totales). Back devolvió en UN solo paso
    a `screen_name:"Search"` (mismo patrón "sin ShowPage intermedia" ya
    documentado en PROJECT_MEMORY.md). Se salió por Home + relanzamiento
    en frío del canal (cold start confirmado por `HomePage:Init` fresco)
    para descartar timing, y en la fila "Continuar viendo" del Home NO
    apareció ninguna tarjeta de "Anteojos" -- el primer tile de la fila
    seguía siendo el contenido de la prueba anterior (Episodio 16 de este
    mismo programa, badge "11 MINUTOS", de SC-UPNEXT-LASTEP-01), es decir
    el contenido reproducido vía Buscar->Player-directo NUNCA se sumó a
    Continuar Viendo pese a haber generado reproducción real confirmada
    por log. Consistente con el `known_issue` ya documentado (backend
    guarda posición pero UI de Home nunca lo refleja para este flujo de
    entrada) -- no es una regresión nueva, sigue siendo el mismo bug de
    PR-174 sin corregir para este camino específico. Evidencia:
    reports/azteca/player/CORRIDA-device63-20260917/telnet.log (líneas
    ~23752-24270 aprox.), capturas 142 (búsqueda), 143-144 (Home/Continuar
    viendo tras relanzamiento, sin la tarjeta esperada).
  title: "Reproducir un contenido directo desde un resultado de búsqueda (sin pasar por ficha de Show), validar si sincroniza a Continuar Viendo"
  area: [player, core-network]
  severity: major
  screen: Buscar -> Player (directo) -> Home
  steps:
    - Buscar un contenido cuyo resultado abra el player DIRECTAMENTE (sin pasar por una ficha de Show intermedia) -- confirmar esto por log/navegación, no asumirlo
    - Contenido de duración confirmada de varios minutos, reproducir solo unos segundos
    - Back, volver al Home, esperar hasta 5 segundos (incluyendo relanzamiento en frío si hace falta para descartar timing)
  expected:
    - El contenido debería aparecer en Continuar Viendo igual que cualquier otro (mismo comportamiento esperado que SC-CW-01)
  logs_watch:
    - Confirmar que el backend efectivamente guardó progreso (buscar el % de avance o la posición en algún evento/log de analytics/beacon) aunque la UI de Home no lo muestre -- eso distingue "no se guardó" de "se guardó pero no se sincroniza a la UI"
  visual_check: captura del Home
  known_issue: >
    Confirmado FALLA 2/2 en la corrida original (2026-09-16 al 2026-09-17,
    ver reports/azteca/continue-watching-pr174/): el backend guarda la
    posición real (confirmado por log) pero el contenido nunca aparece en
    Continuar Viendo, ni siquiera tras relanzamiento en frío. Se observó
    el mismo patrón de forma incidental en al menos un contenido de grilla
    de categoría. Este escenario existe para VIGILAR si esto se corrige en
    una futura versión del fix -- si sigue fallando, no es una regresión
    nueva, es el bug ya conocido y reportado.

- id: SC-CW-04
  status: >
    HALLAZGO 2026-09-17 (continuación 7, device .63, login activo) --
    posible discrepancia con el "Confirmado PASA en la corrida original"
    ya anotado en la nota de este mismo caso, necesita reconfirmación con
    otro contenido antes de subirlo a regresión formal. Contenido usado:
    "Lotería Del Crimen | Tráiler Oficial." (video_id
    68622b921226cf58344ce1b5, duración 00:01:00 -- entrado vía Buscar
    "trailer", que abre el Player DIRECTO sin ShowPage intermedia, mismo
    patrón de SC-CW-03). Reproducido en tiempo real con CERO keypresses
    hasta el fin real, confirmado por log: eventos
    `video_VOD_progress video_percent:"25%"/"50%"/"100%"` seguidos de
    `RAFPlayerTask: state = finished` -> `stopped`, sin BRIGHTSCRIPT ERROR
    nuevo (solo los 2 warnings ya conocidos de roku_ads_lib). La app
    volvió sola a `screen_name:"Search"` sin necesidad de Back manual.
    Se salió a Home con relanzamiento en frío (cold start confirmado por
    `HomePage:Init`/`screen_view screen_name:"Home"` fresco) para
    descartar timing. RESULTADO: el tráiler SÍ aparece en la fila
    "Continuar viendo", como PRIMER tile (más reciente), con badge
    "1 MIN" -- es decir, muestra su DURACIÓN TOTAL completa, no "0
    minutos" ni ninguna indicación visual de que ya se vio/terminó, y no
    fue excluido de la fila pese a haber llegado a 100% real. No se pudo
    confirmar visualmente si hay o no una barra de progreso rota bajo la
    miniatura (a la resolución de captura disponible ningún tile de la
    fila muestra una barra de progreso distinguible, ni siquiera los que
    se saben en progreso parcial real como los de "Lotería del Crimen"
    Temporada 1 con badges de 43-48 minutos) -- limitación de la
    herramienta de captura, no se puede descartar ni confirmar "barra a
    medias" con certeza visual. Lo que SÍ es un hecho verificable: el
    contenido terminado NO desapareció de la fila como el escenario
    espera ("el comportamiento correcto es que directamente no aparezca
    ahí"). Diferencia relevante con la corrida original (que dio PASA):
    esta vez el contenido se reprodujo por el camino "Buscar ->
    Player directo" (mismo camino de SC-CW-03, que ya tiene su propio bug
    de sincronización), mientras que no está confirmado por cuál camino
    se validó originalmente -- es posible que el comportamiento dependa
    del camino de entrada, igual que CW-02/CW-03. Se recomienda reforzar
    con un contenido corto reproducido hasta el final DESDE la ficha del
    show (no desde Buscar) antes de escalar esto a bug confirmado, para
    aislar si es el mismo bug de "camino de entrada" que ya afecta a
    CW-02 y CW-03, o un problema nuevo específico de contenido terminado.
    Evidencia: reports/azteca/player/CORRIDA-device63-20260917/telnet.log
    (líneas ~24384-24850 aprox.), capturas 146-150 (149-150 muestran la
    fila de Continuar Viendo con el tráiler como primer tile, badge
    "1 MIN").

    **REFORZADO 2026-09-17 (continuación 8, device .63) -- CONFIRMADO
    BUG, NO depende del camino de entrada.** Para aislar la variable
    "Buscar directo" vs. "ficha del show" pedida, esta vez se reprodujo
    un contenido corto **entrando explícitamente desde la ShowPage**
    (Lotería del Crimen -> pestaña "Contenido Exclusivo" -> "Detrás de
    Cámaras de 'El Cartero'", video_id 68622a8021f8d20e5d2f5bb7, duración
    real 00:01:49). Confirmado por log que esta vez SÍ hubo
    `screen_name:"Show"` intermedio antes de `screen_name:"Player"`
    (a diferencia del patrón "Buscar -> Player directo" de SC-CW-03/04
    original) -- la variable de camino de entrada quedó correctamente
    aislada. Reproducido en tiempo real con monitoreo pasivo por ECP
    (`query/media-player`) hasta el final real, confirmado por log:
    `video_VOD_progress video_percent:"25%"/"50%"/"100%"` ->
    `RAFPlayerTask: state = finished` -> `stopped`, sin BRIGHTSCRIPT
    ERROR nuevo. La app autoplayeó sola el siguiente clip de la playlist
    de "Contenido Exclusivo" (comportamiento incidental, no pedido por
    el caso) -- se salió con Back x2 a Home y se relanzó en frío
    (`HomePage:Init` fresco confirmado) para descartar timing. RESULTADO:
    el clip "El Cartero" terminado al 100% real **apareció igual como
    PRIMER tile de "Continuar viendo"** en el Home, con badge "1 MIN"
    (su duración total, sin ninguna marca de "visto" ni exclusión de la
    fila) -- **exactamente el mismo patrón ya visto con el tráiler vía
    Buscar->Player-directo** de la corrida anterior. **CONCLUSIÓN: la
    discrepancia NO depende del camino de entrada** (se reprodujo tanto
    entrando por Buscar como por la ficha del show, con Show intermedio
    confirmado) -- es un comportamiento consistente del contenido
    terminado en general, no un artefacto del bug de sincronización de
    posición de CW-02/CW-03 (que sí es específico del camino
    "Buscar directo"). **Se sube la confianza de este hallazgo a BUG
    CONFIRMADO**: contenido VOD corto que llega a 100% real NO se excluye
    de "Continuar viendo" como el escenario espera, independientemente
    de cómo se haya entrado a reproducirlo -- contradice el "Confirmado
    PASA" de la corrida original de PR-174 (que probablemente validó con
    un contenido/condición distinta, o el comportamiento cambió desde
    entonces). Recomendado escalar como hallazgo real al equipo de Core,
    ya no como "necesita reconfirmación". Evidencia:
    reports/azteca/player/CORRIDA-device63-20260917/telnet.log (líneas
    ~26960-27750 aprox.), capturas 169 (pestaña Contenido Exclusivo en la
    ficha, confirmando el camino de entrada), 170 (Home tras relanzamiento
    en frío, "Continuar viendo" con el clip de 1 MIN como primer tile).
  title: "Reproducir un contenido corto hasta el final real, validar que no queda con la barra a medias en Continuar Viendo"
  area: [player, core-network]
  severity: blocker
  screen: Player -> Home
  steps:
    - Elegir un contenido corto (2-4 minutos, para no alargar la prueba) y reproducirlo hasta el FINAL real
    - Confirmar el final real por log (evento `ended`, o auto-avance al siguiente episodio con cambio de `playback_id`) -- no asumir que terminó solo por el tiempo transcurrido
    - Presionar Back
    - Revisar el Home / Continuar Viendo
  expected:
    - El contenido terminado NO debe quedar con una barra de progreso a medias en Continuar Viendo -- el comportamiento correcto es que directamente no aparezca ahí (o se marque como visto, según defina Producto), nunca con una barra rota o en 0% junto a otros ítems en progreso real
  logs_watch:
    - Evento de fin de reproducción (`ended`) o transición automática al siguiente contenido
  visual_check: captura de Continuar Viendo confirmando que el contenido no aparece con barra rota
  note: >
    Este es el caso CRÍTICO del ticket original: el fix de PR-174 rechaza
    todo progreso en 0 para evitar el "0 falso" que causaba el bug, por lo
    que un reseteo legítimo a 0 (contenido terminado) también podría no
    aplicarse bien. Confirmado PASA en la corrida original -- revalidar
    con atención si se toca este código de nuevo.

